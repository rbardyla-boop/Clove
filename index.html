/* DRAWER */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;animation:dFade .2s ease}
@keyframes dFade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(72%,320px);background:#0a0a12;border-left:1px solid rgba(192,57,43,.15);z-index:81;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:dSlide .25s ease;padding:0 0 env(safe-area-inset-bottom)}
@keyframes dSlide{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;position:sticky;top:0;background:#0a0a12;z-index:1;border-bottom:1px solid rgba(192,57,43,.1)}
.drawer-hdr .dh-tag{color:var(--red);font-size:8px;font-family:monospace;letter-spacing:3px;font-weight:800}
.drawer-hdr .dh-close{color:var(--dim);font-size:16px;cursor:pointer;padding:4px 6px;border-radius:4px;transition:color .2s}
.drawer-hdr .dh-close:active{color:#fff}
.drawer-sec{padding:0 10px}
.ds-hdr{display:flex;align-items:center;gap:6px;padding:10px 6px 4px;cursor:pointer;user-select:none;-webkit-user-select:none}
.ds-hdr:active{opacity:.7}
.ds-arrow{font-size:7px;color:var(--dim2);transition:transform .2s;width:10px}
.ds-arrow.open{transform:rotate(90deg)}
.ds-label{font-size:6px;font-family:monospace;letter-spacing:2px;font-weight:800}
.ds-count{font-size:6px;font-family:monospace;color:var(--dim2);margin-left:auto}
.ds-items{overflow:hidden;transition:max-height .25s ease}
.ds-items.collapsed{max-height:0!important}
.di{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;transition:background .15s;text-decoration:none}
.di:active{background:rgba(255,255,255,.03)}
.di-icon{font-size:11px;flex-shrink:0;width:20px;text-align:center}
.di-name{font-size:8px;font-weight:700;font-family:monospace;letter-spacing:.8px}
.drawer-div{height:1px;background:var(--dim3);margin:6px 14px}
.drawer-foot{text-align:center;padding:16px 10px 20px}
.drawer-foot .df-ver{color:var(--dim2);font-size:6px;font-family:monospace;letter-spacing:2px}
.drawer-foot .df-reset{color:var(--dim3);font-size:7px;font-family:monospace;letter-spacing:1px;cursor:pointer;margin-top:8px;padding:6px 12px;border:1px dashed var(--dim3);border-radius:6px;display:inline-block}
.drawer-foot .df-reset:active{color:var(--red);border-color:var(--red)}
.nb-ham{width:38px;padding:10px 0;background:var(--bg2);color:#999;border:none;font-size:14px;cursor:pointer;transition:all .25s;border-radius:0 8px 8px 0;margin-left:-1px;flex-shrink:0}
.nb-ham.on{background:var(--red);color:#fff}
.nb-ham:active{transform:scale(.97)}/* STUCK POINTS */

.stuck-link:active{color:var(--blu);border-color:rgba(90,132,190,.75)}

.phase-advance .pa-tag{font-size:8px;font-family:monospace;letter-spacing:4px;color:var(--red);margin-bottom:8px;opacity:0;animation:paFade .4s ease-out .3s forwards}
.phase-advance .pa-title{font-size:28px;font-weight:900;letter-spacing:4px;color:#fff;opacity:0;animation:paFade .4s ease-out .5s forwards}
.phase-advance .pa-sub{font-size:9px;font-family:Georgia,serif;font-style:italic;color:var(--dim);margin-top:12px;opacity:0;animation:paFade .4s ease-out .7s forwards}
@keyframes paIn{from{opacity:0}to{opacity:1}}
@keyframes paLine{0%{width:0;left:50%}50%{width:100%;left:0}100%{width:100%;left:0;opacity:0}}
@keyframes paFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

const C=[
{s:"spades",n:"A",t:"ROCK BOTTOM IS A FOUNDATION",x:"Rock bottom isn\u2019t where you die. It\u2019s where the bullshit burns off. Everything you thought mattered\u2014the rank, the reputation, the performance\u2014turns to ash, and what\u2019s left is the first honest thing you\u2019ve touched in years. Build on that.",m:"Write down the one thing you\u2019ve been pretending isn\u2019t true. Carry the paper in your pocket for 24 hours.",song:"Hurt",artist:"Nine Inch Nails",breath:false},
{s:"spades",n:"2",t:"THE FIRST HONEST SENTENCE",x:"Recovery starts the moment you say one true thing out loud. Not to a therapist. Not in a journal. To yourself, standing in your kitchen at 6 AM, saying the thing you\u2019ve been performing around for years. The silence after is where the work begins.",m:"Say one true thing out loud right now. To yourself. Stand up, say it, and sit back down.",song:"Heavy",artist:"Linkin Park",breath:false},
{s:"spades",n:"3",t:"YOU ARE NOT YOUR WORST MOMENT",x:"That thing you did. The one that plays on loop at 3 AM. It happened. You did it. And it does not define the totality of who you are. Accountability means owning it, not wearing it like a prison uniform for the rest of your life.",m:"Write two lists. Three things you\u2019re ashamed of. Three things that required courage. You are both lists.",song:"The Unforgiven",artist:"Metallica",breath:false},
{s:"spades",n:"4",t:"THE LIE ABOUT WILLPOWER",x:"Willpower is a finite resource, and anyone who tells you to \u2018just be stronger\u2019 has never been in the suck. You beat addiction with systems, replacement protocols, and the humility to admit your brain is lying to you.",m:"Identify one thing you\u2019ve been trying to beat with willpower alone. Build one system around it.",song:"Institutionalized",artist:"Suicidal Tendencies",breath:false},
{s:"spades",n:"5",t:"STUPID TENACITY",x:"There\u2019s a difference between refusing to quit and refusing to think. Staying in something that\u2019s destroying you isn\u2019t brave. It\u2019s stupid tenacity disguised as courage.",m:"Name one thing you\u2019re grinding through that might not deserve your persistence.",song:"The Red",artist:"Chevelle",breath:false},
{s:"spades",n:"6",t:"THE REPLACEMENT PROTOCOL",x:"You can\u2019t quit something by leaving a hole. You quit by replacing what it was giving you. Name the actual need, then find something that fills it without costing you years.",m:"Pick the habit you most want to quit. Write what it actually gives you. Write one replacement.",song:"Remedy",artist:"Seether",breath:false},
{s:"spades",n:"7",t:"PERMISSION TO BE BROKEN",x:"Permission. You are allowed to be broken. You are allowed to sit on the floor of the shower and let the water run over you while you figure out what the hell just happened to your life. That\u2019s not weakness. That\u2019s a man processing reality.",m:"For 60 seconds, stop performing. Drop your shoulders. Unclench your jaw. Let it hurt.",song:"Snuff",artist:"Slipknot",breath:true},
{s:"spades",n:"8",t:"THE FOG IS COMFORTABLE",x:"The fog\u2014that numb, disconnected autopilot you\u2019ve been running\u2014feels safe because it asks nothing of you. It\u2019s also where men go to die slowly while everyone thinks they\u2019re fine. Get out of the fog.",m:"Do one thing today that scares you slightly. A phone call. A conversation. One act of presence.",song:"Numb",artist:"Linkin Park",breath:false},
{s:"spades",n:"9",t:"SOBRIETY ISN\u2019T THE FINISH LINE",x:"Getting sober is the starting line. The real work is building a life you don\u2019t need to escape from. If you white-knuckle sobriety but change nothing else, you haven\u2019t recovered. You\u2019ve just removed the anaesthetic.",m:"List three things that haven\u2019t changed since you decided to change. Pick one. Change it this week.",song:"Sober",artist:"Tool",breath:false},
{s:"spades",n:"10",t:"THE 60-SECOND RULE",x:"When the craving hits, when the spiral starts\u2014give it 60 seconds. Box breathing. Four in, four hold, four out, four hold. Most cravings peak and fade in under two minutes.",m:"Four seconds in. Four hold. Four out. Four hold. Three rounds. You just overrode the impulse.",song:"Stinkfist",artist:"Tool",breath:true},
{s:"spades",n:"J",t:"THE GHOST IN THE MACHINE",x:"You\u2019ve been running on autopilot so long you forgot there\u2019s a person inside the performance. Strip the title, and if you don\u2019t know who\u2019s underneath, that\u2019s your next mission.",m:"Without using your job title, rank, or role\u2014write one sentence describing who you are.",song:"Duality",artist:"Slipknot",breath:false},
{s:"spades",n:"Q",t:"PAIN IS DATA",x:"Pain isn\u2019t punishment. It\u2019s field intelligence. Your body and brain are screaming coordinates at you. Stop suppressing it and start treating it as the most honest signal you\u2019ve got.",m:"Scan head to feet. Where\u2019s the tension? Write where the pain lives. That\u2019s your intelligence report.",song:"Pain",artist:"Three Days Grace",breath:true},
{s:"spades",n:"K",t:"THE CRAWL",x:"Nobody sprints out of rock bottom. You crawl. One hand in front of the other at whatever speed you can manage, and you do not apologize for the pace. Speed doesn\u2019t matter. Direction does.",m:"What is the smallest forward movement you can make today? One email. One pushup. Do it before you sleep.",song:"Last Resort",artist:"Papa Roach",breath:false},
{s:"hearts",n:"A",t:"YOU WERE A GHOST",x:"Let\u2019s call it what it was. You were in the house but not in the home. Physically present, emotionally deployed. Owning that makes you honest enough to change.",m:"Think of the last time someone tried to connect and you weren\u2019t there. Go ask them one real question. Listen.",song:"Vermilion Pt. 2",artist:"Slipknot",breath:false},
{s:"hearts",n:"2",t:"THE COST OF ARMOR",x:"The armor you built to survive kept you alive. And now it\u2019s suffocating every relationship you have. Your wife isn\u2019t the enemy. Your kids aren\u2019t a threat. But your nervous system doesn\u2019t know that yet.",m:"Tell someone you trust one thing you normally wouldn\u2019t say. One crack in the armor.",song:"The Sound of Silence",artist:"Disturbed",breath:false},
{s:"hearts",n:"3",t:"YOUR SONS ARE WATCHING",x:"Everything you do is curriculum. The way you talk to their mother. Whether you apologize when you\u2019re wrong. They\u2019re not listening to your lectures. They\u2019re watching you.",m:"Next time you screw up in front of your kids, apologize out loud. Show them accountability in real time.",song:"Dear Father",artist:"Sum 41",breath:false},
{s:"hearts",n:"4",t:"THE APOLOGY PROTOCOL",x:"A real apology has three parts and zero buts. What you did. Why it was wrong. What you\u2019re doing differently. \u2018I\u2019m sorry you feel that way\u2019 isn\u2019t an apology\u2014it\u2019s a counterattack in a nice shirt.",m:"Think of one person you owe a real apology. Write it: what, why, what changes. You don\u2019t have to send it yet.",song:"Waiting for the End",artist:"Linkin Park",breath:false},
{s:"hearts",n:"5",t:"SHE\u2019S NOT YOUR THERAPIST",x:"Your partner is not your emotional processing centre. Stop dumping every unfiltered trauma response on the one person who also has to co-parent and maintain her own sanity. Get a professional.",m:"If you don\u2019t have a therapist, find a name and a number today. Just remove the barrier.",song:"Cleaning Out My Closet",artist:"Eminem",breath:false},
{s:"hearts",n:"6",t:"DIVORCE ISN\u2019T FAILURE",x:"Sometimes the bravest thing you can do for your kids is stop making them live inside a war zone you\u2019re calling a marriage. Some should be ended with honour and as little collateral damage as possible.",m:"If you\u2019re staying in something destructive\u2014write what you\u2019re actually staying for.",song:"Schism",artist:"Tool",breath:false},
{s:"hearts",n:"7",t:"THE BID",x:"Every time your kid says \u2018Dad, watch this\u2019\u2014that\u2019s a bid. A small request for connection. You get maybe 10,000 in a lifetime. Every grunt or \u2018not now\u2019 is a declined bid.",m:"For 24 hours, count the bids. Every reach for connection\u2014notice it. Accept as many as you can.",song:"Simple Man",artist:"Shinedown",breath:false},
{s:"hearts",n:"8",t:"PRESENCE IS THE MISSION",x:"You don\u2019t need to be the fun dad, the rich dad, or the dad with all the answers. You need to be the dad who\u2019s actually there. Phone down. Eyes up.",m:"Put the phone in another room for one hour tonight. Be in the room with your people. Just there.",song:"Given Up",artist:"Linkin Park",breath:false},
{s:"hearts",n:"9",t:"THE PENDULUM IN YOUR HOUSE",x:"If you\u2019ve been too hard, the temptation is to go too soft. If you\u2019ve been absent, the temptation is to smother. Find the centre. It\u2019s uncomfortable and it\u2019s where the work is.",m:"Which direction am I overcorrecting? Too hard? Too soft? Name it. The centre is somewhere you haven\u2019t tried.",song:"A New Level",artist:"Pantera",breath:false},
{s:"hearts",n:"10",t:"VULNERABILITY ISN\u2019T WEAKNESS",x:"I spent years thinking vulnerability meant weakness, and then I watched my marriage nearly die because my wife was living with a man she couldn\u2019t reach. Vulnerability is telling the truth when it\u2019s uncomfortable.",m:"Tell someone close to you one thing you\u2019re uncertain about. Watch their face when you stop performing.",song:"Cinderella Man",artist:"Eminem",breath:false},
{s:"hearts",n:"J",t:"THE FIVE-MINUTE RULE",x:"When she starts talking and your brain starts building counterarguments\u2014stop. Give her five uninterrupted minutes. No fixing. No defending. No \u2018well actually.\u2019",m:"Next time your partner starts talking: five minutes, no interrupting. At the end, say \u2018What else?\u2019",song:"Lateralus",artist:"Tool",breath:false},
{s:"hearts",n:"Q",t:"THE OH LORD",x:"The world is hard. It wants to eat your kids alive. Your job is to patch them up and throw them back in. But you will ALWAYS patch them up. It\u2019s brutal, I\u2019ll help you survive it, and I will never stop. That\u2019s love.",m:"Tell your kid one hard truth today\u2014age-appropriate but real. Then tell them you\u2019ll help them handle it.",song:"The Diary",artist:"Scarface",breath:false},
{s:"hearts",n:"K",t:"THE LONG GAME",x:"Marriage isn\u2019t a feeling. Fatherhood isn\u2019t a vibe. These are 30-year operations with constant threat of mission failure. The guys who make it show up anyway.",m:"Write one thing you can do this week that your future self will thank you for. Do it before Sunday.",song:"Eye of the Tiger",artist:"Survivor",breath:false},
{s:"clubs",n:"A",t:"THE MACHINE LIED",x:"The institution promised you brotherhood, security, purpose. And then it fed on your trauma and discharged you into a world it never prepared you for. You weren\u2019t the customer. You were the product.",m:"Name one institution that promised you something and didn\u2019t deliver. Write what they promised vs. what they gave.",song:"Master of Puppets",artist:"Metallica",breath:false},
{s:"clubs",n:"2",t:"INCENTIVE AUTOPSY",x:"Before you believe any institution\u2019s story about itself, ask: who literally profits from this version of events? Follow the money. The story makes sense once you see the incentive structure.",m:"Pick one news story today. Ask: who profits from this narrative? Follow the incentive.",song:"C.R.E.A.M.",artist:"Wu-Tang Clan",breath:false},
{s:"clubs",n:"3",t:"THE PRESS RELEASE ISN\u2019T REALITY",x:"When the official numbers say crime is down but the hospital admits say otherwise, believe the bodies. Physical proxies don\u2019t lie.",m:"Find one statistic you\u2019ve accepted as true and look for the physical proxy.",song:"The Truth",artist:"Beanie Sigel",breath:false},
{s:"clubs",n:"4",t:"SUNK COST LOOP",x:"\u2018I\u2019ve already given 10 years\u2019 is not a reason to give another 10. The only relevant question is: does this serve me going forward? Everything before today is data, not debt.",m:"Identify one thing you\u2019re continuing because of investment, not because it\u2019s working.",song:"Walk",artist:"Pantera",breath:false},
{s:"clubs",n:"5",t:"THE PRESTIGE TRAP",x:"The title, the uniform, the corner office\u2014prestige signals society uses to keep you compliant. You endure abuse because losing the signal feels worse. Build something they can\u2019t take.",m:"Strip your title. What can you do that doesn\u2019t depend on any institution\u2019s permission?",song:"Hail to the King",artist:"Avenged Sevenfold",breath:false},
{s:"clubs",n:"6",t:"PERMISSION TO WALK AWAY",x:"Walking away from something that\u2019s destroying you is not quitting. It\u2019s a tactical withdrawal. The military taught you to never quit, and that lesson is killing men in civilian life.",m:"Name the thing you\u2019ve been told you can\u2019t quit. Ask: who gains from you staying? Permission granted.",song:"I'm Back",artist:"Eminem",breath:false},
{s:"clubs",n:"7",t:"FOLLOW THE MONEY",x:"Dirty money flows through casinos into luxury real estate, construction booms nobody flags, and numbered companies nobody can trace. The system is actually rigged.",m:"Next time a policy doesn\u2019t make sense, trace the money. Who funds it? Who profits?",song:"For the Love of Money",artist:"Bone Thugs-N-Harmony",breath:false},
{s:"clubs",n:"8",t:"REGIME SHIFT RECOGNITION",x:"The rules changed and nobody told you. The man who adapts survives. The man running the old playbook gets crushed.",m:"Name one regime shift in the last five years. Am I still running the old playbook?",song:"Straight Outta Compton",artist:"N.W.A",breath:false},

{s:"clubs",n:"K",t:"THE COUNTER-REVOLUTION",x:"History is made by committed minorities who show up. The seats are empty because men stopped filling them.",m:"Find one local meeting\u2014school board, town council\u2014and attend it. Just show up.",song:"Pulse of the Maggots",artist:"Slipknot",breath:false},
{s:"diamonds",n:"A",t:"ALARM GOES OFF. GET UP.",x:"5:30. Cold water. No negotiation. The first battle of the day is won or lost in three seconds between the alarm and your feet hitting the floor.",m:"Set your alarm 30 minutes earlier tomorrow. Feet on the floor within three seconds.",song:"Ambitionz Az a Ridah",artist:"2Pac",breath:false},
{s:"diamonds",n:"2",t:"CONSUME LESS. BUILD MORE.",x:"Track the ratio. Hours consuming versus hours building. If it\u2019s 3:1 consumption to creation, your life is moving backwards and you\u2019re entertaining yourself while it happens.",m:"Track your next 24 hours. Every hour, mark C (consume) or B (build). Count the ratio.",song:"Hustlin'",artist:"Rick Ross",breath:false},
{s:"diamonds",n:"3",t:"THE ACTIVE/PASSIVE AUDIT",x:"Everything you do is either active or passive. Active builds. Passive disappears. Gaming for 4 hours is passive. Building a game is active.",m:"List everything you did in the last 48 hours. Mark each Active or Passive.",song:"The Art of Peer Pressure",artist:"Kendrick Lamar",breath:false},
{s:"diamonds",n:"4",t:"SUBTRACT BEFORE YOU ADD",x:"Your brain defaults to adding. The expert move is subtraction. What can you remove? The signal gets clearer when you remove noise.",m:"Remove one thing from your life today. One app. One commitment. One object.",song:"Forty Six & 2",artist:"Tool",breath:false},
{s:"diamonds",n:"5",t:"90-DAY CAMPAIGNS",x:"Stop thinking in forever. Think in 90-day campaigns. What does done look like? At Day 90, assess. Renew, pivot, or kill. Everything is an experiment.",m:"Pick one thing you\u2019ve been meaning to do. Define done in 90 days. Start tomorrow.",song:"War",artist:"Pop Smoke",breath:false},
{s:"diamonds",n:"6",t:"THE MIDDLE",x:"The Middle is the unglamorous plateau where the excitement has worn off and the results haven\u2019t appeared. The Middle is where most men fail. It\u2019s also where most success lives.",m:"Write where you\u2019ll see it: \u2018The Middle is where success lives. Keep running the protocol.\u2019",song:"Till I Collapse",artist:"Eminem",breath:false},
{s:"diamonds",n:"7",t:"STRATEGIC PERSISTENCE",x:"Stupid Tenacity says \u2018never quit.\u2019 Strategic Persistence says \u2018keep going on the things worth going on, and have the intelligence to know the difference.\u2019",m:"List three things you\u2019re persisting with. For each: mission right but approach wrong, or mission wrong?",song:"Indestructible",artist:"Disturbed",breath:false},
{s:"diamonds",n:"8",t:"ENVIRONMENT BEATS WILLPOWER",x:"You will never be more disciplined than your environment allows. Make the right thing easy and the wrong thing hard.",m:"Change one thing about your environment right now. Phone in another room. Shoes by the bed.",song:"Rough Ryders' Anthem",artist:"DMX",breath:false},
{s:"diamonds",n:"9",t:"THE BODY KNOWS FIRST",x:"Your body is smarter than your story. When your chest tightens before a meeting, that\u2019s field intelligence. Your body is detecting a threat your conscious mind hasn\u2019t processed.",m:"Scan your body head to feet right now. Where\u2019s the tension? That\u2019s your intelligence report.",song:"Vicarious",artist:"Tool",breath:true},
{s:"diamonds",n:"10",t:"SHIP UGLY",x:"Perfectionism is fear in a lab coat. Ship it ugly. A bad first version that exists beats a perfect version that lives in your head forever.",m:"That thing you\u2019ve been perfecting? Ship it. Today. Ugly and alive beats perfect and imaginary.",song:"Phenomenal",artist:"Eminem",breath:false},
{s:"diamonds",n:"J",t:"THE DEBRIEF",x:"Three questions every night. What worked? What didn\u2019t? What do I do differently tomorrow? Takes 90 seconds. Prevents repeating the same mistakes for 20 years.",m:"Before sleep: What worked? What didn\u2019t? What changes tomorrow?",song:"Many Men (Wish Death)",artist:"50 Cent",breath:false},
{s:"diamonds",n:"Q",t:"IDENTITY PRECEDES ACTION",x:"You don\u2019t start running and then become a runner. You decide you\u2019re a runner, and then you start running. Identity is the operating system.",m:"Write: \u2018I am the kind of man who...\u2019 Finish with who you\u2019re becoming. Read it out loud.",song:"I Am",artist:"Yo Gotti",breath:false},
{s:"diamonds",n:"K",t:"THE SECOND PATH",x:"Behind you is the man you\u2019ve been. Before you are two paths. The first is comfortable. The second is hard. It demands everything. But the second path leads somewhere.",m:"Pick one action from any card in this deck and do it before midnight.",song:"Welcome to the Jungle",artist:"Guns N' Roses",breath:false},
{s:"joker",n:"\u2605",t:"THE MISSING PIECE",x:"Ask yourself what\u2019s missing. Not the motivational poster answer. The thing shaped like a conversation with your kid, or a Tuesday morning where you don\u2019t dread the day. Name it.",m:"Sit quiet for five minutes. What\u2019s the shape of what\u2019s missing? Write the first ache that surfaces.",song:"King of the Hill",artist:"Westside Connection",breath:true},
{s:"joker",n:"\u2605",t:"NOW GET UP.",x:"I\u2019m not writing this from some mountaintop. I\u2019ve been an addict, a ghost in my own house. I\u2019ve had some rough fucking years. And I\u2019m still here. Because I kept getting up. That\u2019s the whole secret.",m:"You drew the last card. Pick any card. Do its mission. Right now. Now get up.",song:"Rough",artist:"DMX",breath:false},
{s:"joker",n:"\u2606",t:"THE OPERATOR\u2019S LOG",x:"Every word you wrote in that evidence file is a brick. Not a diary entry. Not a journal exercise. A brick in the wall between who you were and who you\u2019re becoming. Most men carry the weight in their heads. You put it on paper. That\u2019s not therapy. That\u2019s engineering.",m:"Open your evidence tab. Read your first three entries. Then write one sentence about who wrote those and who\u2019s reading them now.",song:"The Man Comes Around",artist:"Johnny Cash",breath:false},
{s:"joker",n:"\u2606",t:"THE COMEBACK",x:"You fell off. You broke the streak. You did the thing you swore you wouldn\u2019t do again. And now your brain is running the \u2018see, I told you\u2019 program. Here\u2019s what it won\u2019t tell you: every man who ever got clean, got honest, got better\u2014fell off first. Relapse isn\u2019t failure. Staying down is.",m:"Name what happened. No story. No justification. Then name one thing you\u2019re doing in the next 60 minutes to get back on the concrete.",song:"Otherside",artist:"Red Hot Chili Peppers",breath:true},
{s:"addiction",n:"A",t:"THE LOOP",x:"Every addiction runs the same program. Trigger. Craving. Use. Relief\u2014for about twelve minutes. Then shame. Shame makes the pain worse. Pain makes the craving louder. The bottle that promised to silence the noise just turned up the volume and handed you the bill.",m:"Draw the loop right now\u2014trigger \u2192 craving \u2192 use \u2192 relief \u2192 shame \u2192 pain \u2192 craving. Circle where you currently live in it.",song:"Under the Bridge",artist:"Red Hot Chili Peppers",breath:false},
{s:"addiction",n:"2",t:"ONE MORE WON\u2019T HURT",x:"That\u2019s the exact sentence addiction uses to keep you. One more. Just tonight. I\u2019ve had a hard week. I\u2019ll stop tomorrow. I earned this. Every single one of those sentences is your brain lying to you in your own voice, using your own logic, and it sounds completely reasonable until you\u2019re three hours past one more and you hate yourself again.",m:"Write every lie you\u2019ve told yourself before using. All of them. Look at the pattern.",song:"It\u2019s Been Awhile",artist:"Staind",breath:false},
{s:"addiction",n:"3",t:"THE SCREEN AT MIDNIGHT",x:"Porn. Doom-scroll. Rage-bait. Same drug, different delivery system. Your brain gets the dopamine hit without the risk of real connection, real failure, or real feeling. And then you close the tab and the room is exactly as empty as it was before, except now you hate yourself for it too.",m:"Tonight, when the urge hits to open the screen\u2014set a 10-minute timer and sit with the feeling instead. Write what you were actually trying to escape.",song:"Breaking the Habit",artist:"Linkin Park",breath:false},
{s:"addiction",n:"4",t:"SHAME IS THE ACCELERANT",x:"Here\u2019s what nobody told me about shame: it doesn\u2019t stop you from using. It makes you use more. Shame says you\u2019re broken, you\u2019re disgusting, you can\u2019t be fixed. And a man who believes he can\u2019t be fixed has no reason to stop. I ran on shame for years. It didn\u2019t slow me down once. It poured gasoline.",m:"Name the shame you\u2019re carrying. Write it down. Then write underneath: \u2018This is what happened. It is not what I am.\u2019",song:"What I\u2019ve Done",artist:"Linkin Park",breath:false},
{s:"addiction",n:"5",t:"THE TRIGGER MAP",x:"You\u2019re not randomly weak. Your brain is responding to specific signals\u2014Thursday afternoons, the sound of a particular argument, that specific kind of exhausted that feels different from tired. The smell of the bar. The drive past the old house. The addiction knows your schedule better than you do. You can\u2019t disarm a trap you haven\u2019t mapped.",m:"List every trigger you can identify. Time of day. People. Feelings. Locations. Situations. Be specific. That map is your operational intel.",song:"Headstrong",artist:"Trapt",breath:false},
{s:"addiction",n:"6",t:"RAGE IS THE BOTTLE YOU DON\u2019T POUR",x:"Some men never touch alcohol and still drink every day. Rage is the cleanest addiction because it feels righteous. The cortisol spike, the tunnel vision, the feeling of control\u2014it\u2019s the same loop as the bottle. And the people closest to you are the bar. You walk in, get your hit, walk out. They\u2019re the ones left with the damage.",m:"Last time you raged\u2014what were you actually trying not to feel? Name the real thing underneath the anger. Not the story you told yourself. The real thing.",song:"Blind",artist:"Korn",breath:true},
{s:"addiction",n:"7",t:"THE MORNING AFTER",x:"You know exactly what this feels like. The ceiling. The inventory. What did I do. What did I say. How bad was it this time. That specific flavour of self-hatred that lives in the gap between who you were the night before and who you have to be today. That feeling is not proof you\u2019re hopeless. It\u2019s proof the real you is still in there\u2014disgusted by what the addiction does with your body while you\u2019re not watching.",m:"Write one sentence to the person you were before this started. Tell them what you know now.",song:"Beautiful",artist:"Eminem",breath:false},
{s:"addiction",n:"8",t:"THE SUBSTITUTE TRAP",x:"You quit drinking and started gambling. Quit gambling and started eating. Quit eating and started working 80-hour weeks and calling it discipline. Same hole. Different shovel. The addiction isn\u2019t the substance\u2014it\u2019s the running. Until you stop running, the hole just moves. I know. I moved mine across three different zip codes before I figured it out.",m:"Look at what you picked up after the last thing you put down. Same escape pattern, different label?",song:"Running",artist:"Everclear",breath:false},
{s:"addiction",n:"9",t:"THE GAMBLING MATH",x:"The house always wins. You know that. Everyone knows that. But the near-miss\u2014that\u2019s the hook. Your brain processes the almost-win the same way it processes an actual win. The same dopamine. The same signal. They engineered that. On purpose. It\u2019s not bad luck. It\u2019s a machine built to eat you, and it\u2019s very good at its job.",m:"Add up the actual total. All of it. Don\u2019t round down. Don\u2019t exclude the ones that don\u2019t count. Write the number and sit with it for 60 seconds.",song:"Prison Song",artist:"System of a Down",breath:false},
{s:"addiction",n:"10",t:"THE BODY COUNT",x:"Name them. The people who watched you choose the bottle over them. The job that went sideways. The version of yourself you were before. The nights your kids went to bed without you actually being there\u2014not your body, you. The addiction will tell you the damage isn\u2019t that bad. It\u2019s lying. It always lies about the cost. That\u2019s the only way it survives.",m:"Write the body count. Every person. Every thing. Every version of yourself the addiction has taken. Then write at the bottom: I am not done yet.",song:"Wake Up",artist:"Rage Against the Machine",breath:false},
{s:"addiction",n:"J",t:"THE 90-SECOND WINDOW",x:"Between the trigger and the use, there\u2019s a window. Ninety seconds\u2014the time it takes for the cortisol spike to peak and start to fall. Most men don\u2019t know the window exists. They think the craving is a freight train with no brakes. It\u2019s not. It\u2019s ninety seconds. Your body is running a program that expires in ninety seconds. You can outlast ninety seconds.",m:"Next time the craving hits, set a timer for 90 seconds. Breathe. Don\u2019t negotiate with it. Don\u2019t fight it. Just outlast the spike. That\u2019s the whole protocol.",song:"Wait and Bleed",artist:"Slipknot",breath:true},
{s:"addiction",n:"Q",t:"RELAPSE IS DATA",x:"Relapse is not proof that you\u2019re hopeless. It is the most detailed report your addiction will ever give you. The exact trigger. The exact lie. The exact moment the window closed. If you treat it as failure you learn nothing and hate yourself for free. If you treat it as intelligence you find the gap in the wire and you fix it. I\u2019ve filed a lot of those reports. Every one of them taught me something the good days couldn\u2019t.",m:"After the last relapse\u2014what was the trigger, what was the lie, what was the moment the window closed? Write it. That\u2019s your after-action report.",song:"Failure",artist:"Breaking Benjamin",breath:false},
{s:"addiction",n:"K",t:"THE SIGNAL",x:"You\u2019re not weak for wanting to escape. You\u2019re human. You\u2019re living with pain that most people will never understand, and you found something that made it stop, even for an hour. The escape is not the weakness. The escape is the lie. The pain is the signal. Your body and your brain are screaming coordinates at you. The second you stop running from it and start listening\u2014actually listening\u2014the chains start breaking. Not all at once. One link at a time. But they break.",m:"Sit with the pain for five minutes. Don\u2019t run. Don\u2019t numb. Don\u2019t negotiate with it. Just listen. What is it actually trying to tell you?",song:"Not Afraid",artist:"Eminem",breath:true},
{s:"ptsd",n:"A",t:"THE PERIMETER",x:"You\u2019re always running it. Walking into a restaurant, you took the corner seat before you knew why. In a parking lot, you clocked the exits before you turned off the engine. At your kid\u2019s birthday party, you counted the adults and identified the one who made you uneasy. You can\u2019t turn it off because it was never a switch\u2014it was a rewire. Your brain rebuilt itself around threat detection and now it\u2019s doing its job in a world that doesn\u2019t have any. That\u2019s the wound. Not that you\u2019re dangerous. That you can\u2019t find the off switch.",m:"Next time you walk into a space\u2014notice the scan happening. Don\u2019t stop it. Just observe it. Name what your nervous system is looking for. That\u2019s the beginning of understanding your own perimeter.",song:"Soldier",artist:"Eminem",breath:false},
{s:"ptsd",n:"2",t:"THE STARTLE",x:"A car backfired on your street and you were on your feet in 0.2 seconds and your hands were up and your body had already made 40 decisions before your brain finished the sentence \u2018that was a car.\u2019 Your partner watched you come back from wherever you went, and you said you were fine, and that was the loneliest sentence you\u2019d said all week. The startle response is not a character flaw. It is a biological alarm system calibrated for an environment you no longer live in. It\u2019s not broken. It\u2019s misfiring.",m:"Name the last time you startled. What was the trigger? Where did you go for those two seconds before you came back? Write what that space felt like.",song:"Bullet with Butterfly Wings",artist:"Smashing Pumpkins",breath:false},
{s:"ptsd",n:"3",t:"THE KILL HOUSE",x:"The kitchen at 6 AM isn\u2019t a kitchen. The living room at night isn\u2019t a living room. Your brain doesn\u2019t update the label until it\u2019s sure. So it runs the same assessment it ran in every room you entered with a weapon in your hands\u2014entry points, threats, clearance. Your family moves through these spaces and sees furniture. You see a tactical problem you\u2019ve already solved seventeen times before breakfast. You are not crazy. You are doing exactly what you were trained to do.",m:"Pick one room in your house. Consciously walk through it and name everything as safe. Not \u2018probably safe.\u2019 Actually safe. Train the brain to update the assessment.",song:"Bodies",artist:"Drowning Pool",breath:false},
{s:"ptsd",n:"4",t:"THE COST OF ALWAYS BEING RIGHT",x:"You\u2019ve been right so many times about danger that you can\u2019t tolerate being wrong. Hypervigilance is exhausting to live with, but it\u2019s even more exhausting to argue with. Every time your read on a situation turned out to be correct, the wiring got one loop tighter. Now you\u2019re paying for every accurate threat assessment you ever made with every false alarm that fires in your own house. You weren\u2019t wrong then. The cost just got transferred.",m:"Think of the last time you were certain of a threat that turned out to be nothing. Write it without judgment. What was your body trying to protect? What was the actual risk?",song:"Ten Thousand Fists",artist:"Disturbed",breath:false},
{s:"ptsd",n:"5",t:"THE NIGHT WATCH",x:"Sleep isn\u2019t rest when part of your brain refuses to hand over the perimeter. You wake at 2 AM and know the layout of the room before you open your eyes. Every sound gets catalogued. The creak of the house. The car outside. The specific silence that\u2019s too quiet. You haven\u2019t slept a full night since before you got back, and you\u2019ve stopped telling people because explaining it takes more energy than the insomnia does.",m:"Tonight, before you try to sleep\u2014issue a verbal stand-down. Out loud or in your head: \u2018Perimeter is clear. I have people on watch. My job right now is to sleep.\u2019 It feels stupid. Do it anyway.",song:"Enter Sandman",artist:"Metallica",breath:true},
{s:"ptsd",n:"6",t:"THE SWITCH",x:"There\u2019s a version of you that came out in the field that you\u2019ve never fully put away. Controlled. Fast. Zero hesitation. And then there\u2019s the version your family needs\u2014patient, slow, present. The problem is the switch between them is a hair trigger. The wrong version shows up. In the kitchen. At the school. At the dinner table. You\u2019re not a monster for having both. You\u2019re a man who needs to learn which one to deploy and when.",m:"This week, once a day, consciously choose which version to bring into the room before you walk through the door. Work version or home version. Deliberate. Not reactive.",song:"Break Stuff",artist:"Limp Bizkit",breath:false},
{s:"ptsd",n:"7",t:"DISPOSABLE",x:"They trained you, deployed you, and handed you a pamphlet and a phone number. The institution that rewired your brain for war did not wire it back. Nobody told you the rewiring was your problem now. The loneliness of that\u2014standing in a grocery store with your threat-assessment brain running a full combat scan over breakfast cereal\u2014is something they never prepared you for. And then they wonder why you\u2019re angry.",m:"Name one specific thing the institution didn\u2019t prepare you for. Write it down. Not to be bitter\u2014to be accurate. Accurate is the beginning of figuring out the workaround.",song:"Disposable Heroes",artist:"Metallica",breath:false},
{s:"ptsd",n:"8",t:"BLAST RADIUS",x:"Hypervigilance doesn\u2019t just affect you. It radiates. Your kids learned to read the room before they could read words. Your partner learned to announce themselves before entering a room you\u2019re in. The people closest to you have been living inside your blast radius, making micro-adjustments, walking the perimeter of your perimeter. They love you. They\u2019re also exhausted. That\u2019s the honest truth\u2014and it\u2019s a truth most men don\u2019t let themselves see.",m:"Ask one person who lives with you: \u2018What do you do differently because of how I am?\u2019 Listen. Don\u2019t explain. Don\u2019t defend. Just take the intel.",song:"When I\u2019m Gone",artist:"Eminem",breath:false},
{s:"ptsd",n:"9",t:"SEEING WHAT OTHERS CAN\u2019T",x:"The danger is real. You see things other people are too comfortable to notice\u2014the guy near the exit who doesn\u2019t look right, the car that\u2019s been parked too long, the energy shift in a room before anything happens. And then you say something and they look at you like you\u2019re the problem. The loneliness of accurate threat perception in a population that\u2019s never had to be accurate\u2014that\u2019s a specific kind of isolation that nobody writes about and almost nobody understands.",m:"Name one time your read on a situation was right when everyone around you thought you were wrong. Write it. Then write: \u2018My system works. The problem is the environment, not the calibration.\u2019",song:"Mad World",artist:"Tears for Fears",breath:false},
{s:"ptsd",n:"10",t:"THE JAW",x:"Where does it live? For most men it\u2019s the jaw. Or the shoulders\u2014a permanent brace against impact that never comes. Or the hands that stay fisted when nothing\u2019s happening. Your body has been doing threat posture so long that neutral feels like surrender. Relaxation feels like vulnerability. And vulnerability in a tactical environment gets people killed. So your body refuses to stand down because some part of your nervous system is still in the AO and will not be convinced otherwise.",m:"Right now. Drop your shoulders. Unclench your jaw. Open your hands flat. Hold it for 60 seconds. Notice every instinct that wants to re-brace. That instinct is the data.",song:"Down in a Hole",artist:"Alice in Chains",breath:true},
{s:"ptsd",n:"J",t:"THE STAND DOWN ORDER",x:"Nobody gave you one. You came back and the world expected you to just recalibrate. As if calibration is a dial and not a decade of lived wiring. The stand down order has to come from inside, and it has to be issued deliberately, every single day, because your nervous system will not do it automatically. You don\u2019t feel your way to standing down. You do it on purpose, with the same discipline you brought to everything else. That\u2019s not weakness. That\u2019s the hardest command you\u2019ll ever give yourself.",m:"Issue yourself the stand down order today. In writing: \u2018As of [time], the perimeter is clear. I am off watch. I will let the people around me carry their own threat assessments for the next [time block].\u2019 Sign it.",song:"Comfortably Numb",artist:"Pink Floyd",breath:false},
{s:"ptsd",n:"Q",t:"CONTROLLED AGGRESSION",x:"The aggression isn\u2019t the problem. Uncontrolled aggression is the problem. Every high performer who ever changed anything was running controlled aggression\u2014the surgeon in the ER, the operator on the breach, the father who keeps showing up when every instinct says get out. They\u2019re all running it. Your job isn\u2019t to eliminate the aggression. Your job is to put it on a leash, hand it a direction, and point it at something that deserves it.",m:"Name one thing in your life right now that deserves your full aggression\u2014a real problem, not a person. A disease. A bad situation. A limitation you want to break. Point the weapon at that.",song:"Cochise",artist:"Audioslave",breath:false},
{s:"ptsd",n:"K",t:"CALIBRATED",x:"You\u2019re not paranoid. You\u2019re calibrated. The world really is that dangerous\u2014you just learned to see it before anyone else. The problem isn\u2019t the radar. The problem is that the radar never turns off, and now you\u2019re scanning your own living room like it\u2019s a hostile AO. Your system isn\u2019t broken. It\u2019s doing exactly what it was trained to do in a world that\u2019s now too safe for it. The loneliness of being the only one who can see the threat when everyone else thinks you\u2019re the threat\u2014that\u2019s not madness. That\u2019s the tax on being the kind of man who paid attention when it mattered.",m:"Write this down and put it somewhere you\u2019ll see it: \u2018My system works. My environment changed. The mission now is recalibration\u2014not decommissioning.\u2019",song:"War Pigs",artist:"Black Sabbath",breath:false},
{s:"rebuild",n:"A",t:"THE TUESDAY MORNING",x:"It wasn\u2019t dramatic. It was a Tuesday morning in the kitchen. My six-year-old walked in for cereal and stopped when he saw the bottle. He didn\u2019t say anything. Didn\u2019t get angry. He just looked at it, then at me, then at the floor. Like he\u2019d already accepted this was how mornings went now. That kind of tired in a six-year-old\u2019s eyes\u2014not the tired from staying up late, the tired from being disappointed by the same person too many times. That\u2019s the one that broke through. Not the fights. Not the blackouts. His face already making peace with a version of his dad I hadn\u2019t agreed to be.",m:"Write down the moment. The specific one. Not the story you built around it\u2014the moment itself. What was the exact thing you saw? That detail is the foundation. You can only know how far you\u2019ve come if you know exactly where you started.",song:"Cat\u2019s in the Cradle",artist:"Harry Chapin",breath:false},
{s:"rebuild",n:"2",t:"THE QUIET SHAME",x:"There are two kinds of shame. The kind people put on you and the kind that\u2019s yours because you made it. The second kind is harder, because you can\u2019t blame anyone for it and you can\u2019t defend against it because it\u2019s accurate. You know exactly what you did. You remember the specific moments. The faces. The sentences you said that you can\u2019t unsay. That shame doesn\u2019t respond to positive self-talk. It doesn\u2019t care about your new routine. It waits until 3 AM and shows you the highlight reel. The only thing that moves that shame is behavior. Not words. Not promises. What you do tomorrow.",m:"Name three specific things you\u2019re most ashamed of. Don\u2019t soften them. Then write one behavior\u2014not a promise, a behavior\u2014that contradicts each one. That\u2019s the whole plan.",song:"The Scientist",artist:"Coldplay",breath:false},
{s:"rebuild",n:"3",t:"THE INVENTORY",x:"Before you can rebuild you have to know exactly what you burned. Not the vague \u2018I wasn\u2019t a good husband/father/friend\u2019 version\u2014the specific version. The exact things. The money. The trust. The versions of yourself you destroyed. The people who had to reorganize their lives around your wreckage. I\u2019m not saying this to punish you. I\u2019m saying this because the men who rebuild on denial build crooked. The foundation has to be accurate. You cannot build something true on something false.",m:"Write the complete inventory. Everything you burned. Everything you cost other people. No minimizing, no context, no \u2018but.\u2019 Just the list. This is your real starting position.",song:"Better Man",artist:"Pearl Jam",breath:false},
{s:"rebuild",n:"4",t:"THE FIRST MORNING",x:"Here\u2019s what nobody tells you: the first morning doesn\u2019t feel like a beginning. It feels like an ending. You\u2019re not standing at the start of something\u2014you\u2019re standing in the rubble of everything you already destroyed, completely sober, with no story yet that makes it okay. That\u2019s the right place to start. Not from inspiration. Not from a speech you gave yourself. From the specific cold and quiet truth of a Tuesday morning where you decided not to pour the drink. That\u2019s the seed. Not the oak.",m:"Describe your first morning. Not the story you\u2019ve built around it\u2014what it actually felt like. Cold, unglamorous, uncertain. Write it down so future you can look back and see exactly where this started.",song:"Learning to Breathe",artist:"Switchfoot",breath:true},
{s:"rebuild",n:"5",t:"THE EMBARRASSMENT OF TRYING AGAIN",x:"You\u2019ve tried before. You made promises in front of people and then broke them. So trying again comes with a specific kind of embarrassment nobody talks about\u2014the humiliation of being hopeful when you\u2019ve already proven your hope unreliable. The men who rebuilt successfully were embarrassed too. They were just embarrassed in private long enough to build something worth being proud of. You don\u2019t need to announce it. You just need to do it.",m:"Name the specific embarrassment. The person who watched you break the last promise. Write what you would need to do\u2014not say, do\u2014to make that relationship accurate again. Not to earn forgiveness. Just to make your behavior match your stated values.",song:"Starting Over",artist:"Chris Stapleton",breath:false},
{s:"rebuild",n:"6",t:"NOBODY\u2019S WATCHING",x:"The hardest part of rebuilding is that almost none of it is visible. The decisions that matter most happen when nobody\u2019s there\u2014the 6 AM when you didn\u2019t pour the drink, the Tuesday when you came home instead of stopping, the night you sat with your kid and actually listened instead of performing listening. Nobody gives you a badge for that. The audience you\u2019re trying to impress isn\u2019t watching, and the audience that is watching is in wait-and-see mode because they\u2019ve seen the movie before. You do this work without applause. That\u2019s how you know it\u2019s real.",m:"Name one thing you did right this week that nobody saw and nobody knows about. Write it down. Not for credit. So you know you did it.",song:"Ordinary World",artist:"Duran Duran",breath:false},
{s:"rebuild",n:"7",t:"THE DEBT THAT DOESN\u2019T CLEAR",x:"Some of the people you hurt don\u2019t owe you forgiveness. They might never give it. They might look at you differently for the rest of your life. They might protect themselves from you in ways that hurt to watch. And they\u2019re not wrong\u2014they have evidence. You built that evidence over years. You can\u2019t negotiate it away with changed behavior. You can only pay it forward by becoming the person who wouldn\u2019t have created it. That\u2019s not satisfying. It\u2019s just true.",m:"Name one person who doesn\u2019t owe you forgiveness. Write what you would need to become\u2014not say, become\u2014to make the debt smaller. Not to earn forgiveness. Just to be accurate about who you\u2019re building toward.",song:"Fix You",artist:"Coldplay",breath:false},
{s:"rebuild",n:"8",t:"THE IDENTITY GAP",x:"Who are you without the thing that was destroying you? You built your personality around the coping mechanisms\u2014the drinking persona, the rage persona, the guy-who-doesn\u2019t-care persona. Now that guy is supposed to be gone. So who are you? This is the gap nobody prepares you for. The identity vacuum between who you were and who you\u2019re supposed to become. You will feel like a stranger in your own skin. That is not regression. That is the building after the fire, before the rebuild. That\u2019s the exact phase where the foundation gets set.",m:"Write three things that are true about you that have nothing to do with what you\u2019re leaving behind. Not things you used to be. Not things you want to be. Things you actually are right now. That\u2019s the raw material.",song:"Losing My Religion",artist:"R.E.M.",breath:false},
{s:"rebuild",n:"9",t:"THE SMALLER VERSION",x:"You are not starting from zero. You are starting from less than zero, because zero has no debt and no wreckage and no one watching to see if this is real. You are starting from a position smaller than where you began\u2014less trust, less goodwill, fewer options, a higher bar to clear. That is the real start point. The men who rebuilt successfully knew exactly how small they were standing. They didn\u2019t talk themselves into a bigger starting position. They got up from the real one.",m:"Write your actual starting position. Not the polished version. The real one\u2014what people actually think of you right now, what trust you actually have, what you actually have to work with. Then: what is the one first thing that changes it?",song:"Rock Bottom",artist:"Eminem",breath:false},
{s:"rebuild",n:"10",t:"THE CHANGED MAN PROBLEM",x:"You\u2019ve changed. You know you\u2019ve changed. The problem is nobody around you is obligated to update their read on you on your timeline. They\u2019re running on evidence\u2014and their evidence is correct. You built it over years. You don\u2019t get to decide when it expires. You don\u2019t get to tell people they should trust you now. You show up differently, consistently, over time, and you let them decide. The frustration of doing the work and not being believed yet\u2014that frustration is the cost of the years before. It is accurate. Pay it.",m:"Name the one person whose updated read on you matters most. What would they need to see, consistently, over what time period, to update their read? Write that as a specific behavior plan, not a wish.",song:"Prove It All Night",artist:"Bruce Springsteen",breath:false},
{s:"rebuild",n:"J",t:"THE QUIET WORK",x:"Recovery is not dramatic. The real work is unglamorous, private, and relentlessly ordinary. It\u2019s showing up to the Tuesday when you don\u2019t feel like it and nobody\u2019s watching. It\u2019s doing the thing you said you\u2019d do when there\u2019s no external pressure. It\u2019s building in the dark and trusting that something is accumulating even when you can\u2019t see it. The men who rebuilt successfully did not feel inspired most days. They showed up because showing up was the job. That\u2019s the whole system.",m:"Write your minimum viable day. The bare minimum that constitutes showing up\u2014even on your worst days, even when everything in you wants to quit. That floor is your foundation. Never go below it.",song:"Patience",artist:"Guns N\u2019 Roses",breath:false},
{s:"rebuild",n:"Q",t:"THE FORGIVENESS YOU WON\u2019T GET",x:"You might do all the work. You might become exactly the man you needed to be fifteen years ago. And the people you hurt might still not forgive you. Might still keep their distance. Might still protect themselves. And you still have to keep going. Not to earn their forgiveness. Not because you\u2019ll eventually get it. Because becoming the man who would never do that again is the only answer to having done it. You do it for the people still here. You do it for the version of yourself your kids will remember.",m:"Write what you would do differently if forgiveness was permanently off the table\u2014if the answer was always no. Would you still do the work? If yes, do it. If the answer is no, sit with that. It tells you something.",song:"Serenity",artist:"Godsmack",breath:false},
{s:"rebuild",n:"K",t:"THE REAL REBUILD",x:"You didn\u2019t rebuild from wreckage. You rebuilt from the pieces that were left after you burned everything down yourself. And that\u2019s harder. Because the shame is yours. The guilt is yours. The people you hurt don\u2019t owe you forgiveness and they might never give it. But you still have to get up every day and become the kind of man who would never do that again\u2014even if nobody ever believes you changed. That\u2019s the real rebuild. Not the comeback story. The quiet part where you keep choosing the harder thing when every part of you wants the easy lie back.",m:"Write one sentence that describes exactly who you\u2019re trying to become\u2014not what you\u2019re trying to stop doing. One sentence about the man, not the absence of the problem. Put it somewhere you\u2019ll see it every morning.",song:"Rise",artist:"Eddie Vedder",breath:false},
{s:"brotherhood",n:"A",t:"THE 2:47 AM GARAGE",x:"Mike. Concrete. Empty bottle. He showed up unannounced, sat down next to you without a word for a long time, looked at the bottle, looked at you, and said 'I see you, brother. You're not carrying this by yourself anymore.' That was the moment.",m:"Text one man today. Not a long message. Just 'you good?' That's the door.",song:"With a Little Help from My Friends",artist:"Joe Cocker",breath:false},
{s:"brotherhood",n:"2",t:"THE PERFORMANCE",x:"Years of managing how much they see. The edited version you present as fine. Every time you managed what they saw, you got a little more alone.",m:"Tell someone one true thing today you'd normally sand down before saying it.",song:"Mad World",artist:"Gary Jules",breath:false},
{s:"brotherhood",n:"3",t:"THE COST LEDGER",x:"Marriage. Kids' trust. Almost your life. What carrying it alone actually took. You can't fight what you won't name. This isn't self-pity. This is reconnaissance.",m:"Write down what isolation has already cost you. Concrete. No minimizing.",song:"Brothers in Arms",artist:"Dire Straits",breath:false},
{s:"brotherhood",n:"4",t:"THE WALL",x:"The training made you build it. Stoic, capable, handle it yourself. It worked. Then it didn't. You didn't build it overnight. One brick at a time, from experiences that taught you needing someone was dangerous.",m:"Identify one wall you built that you thought was protection. Who can't reach you because of it?",song:"Another Brick in the Wall Pt. 2",artist:"Pink Floyd",breath:false},
{s:"brotherhood",n:"5",t:"THE SIT-DOWN",x:"Mike sat on the concrete without saying anything for a long time. That was the whole thing. You didn't need him to solve it. You needed proof that someone could see it and stay.",m:"Next time someone is struggling — don't fix it. Don't advise. Sit in it with them for five minutes without saying anything useful.",song:"Lean on Me",artist:"Bill Withers",breath:false},
{s:"brotherhood",n:"6",t:"THE SENTENCE",x:"'I see you, brother. You're not carrying this by yourself anymore.' That cracked it open. It wasn't the words. It was that he meant them and you knew it. Presence, then the words. In that order.",m:"Say one unsexy, unedited true thing to someone in your crew today. Not inspirational. Real.",song:"I'll Stand by You",artist:"The Pretenders",breath:false},
{s:"brotherhood",n:"7",t:"THE WRONG KIND OF STRONG",x:"The training said handle it. The training was wrong about this specific thing. Strength in combat means handling it alone. Strength in recovery means knowing when alone is the problem.",m:"Ask for help with something today. Anything. Small is fine. Practice the muscle.",song:"Hero of the Day",artist:"Metallica",breath:false},
{s:"brotherhood",n:"8",t:"REAL ACCOUNTABILITY",x:"Not someone watching you succeed. Someone who gets on the concrete when it all falls apart. Accountability isn't someone checking your progress. It's someone who knows your full history and still returns your calls.",m:"Who in your life would show up at 2:47 AM if you texted 'I'm in the garage'? If nobody — finding that one person is this week's mission.",song:"Come as You Are",artist:"Nirvana",breath:false},
{s:"brotherhood",n:"9",t:"THE FIRST CALL",x:"The hardest rep you'll ever do is picking up the phone when you're in it. You can do a hundred pushups without thinking. One honest phone call will floor you. That's not weakness. That's the size of what you've been carrying.",m:"Make the call you've been avoiding. The one where you'd have to actually say what's happening instead of 'I'm good.'",song:"Reach Out I'll Be There",artist:"Four Tops",breath:false},
{s:"brotherhood",n:"10",t:"THE WRONG CREW",x:"Not every man in your life is capable of being in your crew. That's not a failure. That's information. You can love someone and still know they can't carry this with you.",m:"Audit your inner circle. Who flinches when you're real? That's your map of who isn't built for your trench.",song:"True Colors",artist:"Cyndi Lauper",breath:false},
{s:"brotherhood",n:"J",t:"THE WITNESS",x:"Letting someone see the full version — not the managed, presentable one. You've told the story a hundred times. You haven't told it once. The version where you were actually scared, actually broken — that's the one that connects.",m:"Tell someone the version of a story you've never told anyone. The real one, not the one that makes you look better.",song:"Creep",artist:"Radiohead",breath:false},
{s:"brotherhood",n:"Q",t:"THE DEBT PAID FORWARD",x:"What you owe Mike you can't repay to Mike. So you find the next man on the concrete and you sit down. Mike didn't expect repayment. He expected that someday you'd sit down next to someone else.",m:"Who in your life is sitting on their own concrete right now? Show up for them this week.",song:"Thank You",artist:"Led Zeppelin",breath:false},
{s:"brotherhood",n:"K",t:"THE KING",x:"Real brotherhood isn't someone coming to rescue you. It's someone who looks at the worst parts of you — the bottles, the rage, the shame, the man you became when you were lost — and still chooses to stand in the fire with you and say 'We're walking out of this together. Even if it takes years. Even if you fall again. I'm not leaving.' You don't have to be fixed to belong. You just have to stop pretending you can do it alone.",m:"Write the names of the men who chose to stand in the fire with you. Then write who you've stood in the fire for. The gap between those lists is your next mission.",song:"Into the Fire",artist:"Bruce Springsteen",breath:false},
{s:"hearts",n:"14",t:"THE WATCH ON YOUR WRIST",x:"Your wife becomes the watch on your wrist. Your kids become the hum of the refrigerator. Essential. Beloved, even. But unnoticed. This is not cruelty \u2014 it\u2019s neurology. Your brain stops registering constant stimuli. The people who are always there become invisible, not because you don\u2019t love them, but because their presence has become as unremarkable as your own breathing. Hedonic adaptation is the biological process that stops you from seeing what you have. It kept our ancestors alive. It is destroying your marriage.",m:"Today, look at the person closest to you as if you are meeting them for the first time. What would you notice? Write it down. Then tell them.",song:"Cat\u2019s in the Cradle",artist:"Harry Chapin",breath:false},
{s:"ptsd",n:"14",t:"THE HIDDEN 100",x:"A hundred percent means they expect a hundred percent next time. It feels like you just pulled the pin on a grenade. So you fold it up and hide it. You mask downward \u2014 not performing competence, but performing limitation. Because if they believed you were less than, they were gentle when you stumbled. The Hidden 100 is the habit of hiding your best work because your nervous system can\u2019t handle the expectation that success creates. Excellence is dangerous when the fall from future failure is measured by the highest point you\u2019ve ever shown.",m:"Name one thing you are genuinely good at that you have been hiding or downplaying. Tell one person the real number today. Not the sandbagged version.",song:"Fake It",artist:"Seether",breath:false},
{s:"ptsd",n:"15",t:"THE PROSTHETIC",x:"The army was a prosthetic. I just didn\u2019t know what it was prostheticizing. The rigid structure, the unambiguous expectations, the constant physical output \u2014 it was accidentally the perfect treatment program for a brain that couldn\u2019t regulate itself internally. The furnace of military training installed the external regulation my hardware couldn\u2019t produce. Then I got out, and the prosthetic came off, and the thing it was supporting collapsed. Every veteran who struggles in transition is not weak. They lost the structure their nervous system was borrowing.",m:"What structure in your life is acting as a prosthetic for something you have not named yet? If it disappeared tomorrow, what would collapse? Write that down. That is the real dependency.",song:"The Pretender",artist:"Foo Fighters",breath:false},
{s:"addiction",n:"14",t:"THE UNMET NEED",x:"The internet is not the problem. The bottle is not the problem. The unmet needs are the problem. Meet the needs, the pull goes away. Every addiction is a solution to a problem you have not named yet. Boredom. Loneliness. The need for mastery. The need to matter. The dopamine hit from \u2018I couldn\u2019t do this last week and now I can\u2019 is the same dopamine hit games were giving you. But this one leaves something behind. Stop asking what you are addicted to. Start asking what you are starving for.",m:"Name the need behind your last relapse, binge, or scroll session. Not the trigger \u2014 the need. Boredom? Connection? Mastery? Progress? Now find one real-world action that meets the same need. Do it today.",song:"Under the Bridge",artist:"Red Hot Chili Peppers",breath:false},
{s:"spades",n:"14",t:"THE FORTRESS",x:"You cannot reason someone out of fortress mode because fortress mode is specifically designed to resist reasoning. This includes reasoning with yourself. When your identity fuses with a belief \u2014 or a trauma response, or a coping mechanism \u2014 challenging it triggers the same brain response as a physical threat. The amygdala fires. The reasoning centres go dark. The brain stops evaluating and starts defending the organism. A prison built of identity cannot be escaped because there is no prisoner separate from the prison. The walls are the self.",m:"Name one belief you hold that you would feel personally attacked if someone questioned. That is your fortress. Write the belief, then write underneath: \u2018I am not this belief. I am the person examining it.\u2019",song:"Comfortably Numb",artist:"Pink Floyd",breath:false},
{s:"rebuild",n:"14",t:"THE ERSATZ",x:"Building an organic personality is harder than downloading an ersatz one. It takes longer. It requires tolerating the very uncertainty that drove you to the ideology, or the addiction, or the persona, in the first place. You arrive empty and uncertain. They hand you a ready-made identity \u2014 the party line, the group uniform, the script that tells you what to value and who to hate. It fits immediately because it was designed to fit anyone. The price is you. Your nuances get hollowed out and replaced with identical software. One brick is as good as another.",m:"List three things about yourself that you chose versus three things you inherited from a group, a persona, or a system. Which ones would survive if the group disappeared? The ones that survive are you. The rest is borrowed.",song:"Everybody\u2019s Fool",artist:"Evanescence",breath:false},
{s:"rebuild",n:"15",t:"THE WINDSHIELD WIPER",x:"There is no fix. There is only the windshield wiper. Constant correction. The moment you stop wiping, the rain accumulates. You do not cure hedonic adaptation or inattention or taking people for granted. You install a wiper and you accept that it runs forever. Fighting it is not a one-time fix. It is a daily practice. A constant vigilance. The effort itself is a form of love. That is not depressing. That is freeing \u2014 once you stop waiting for the day you arrive and start accepting that the drive is the whole thing.",m:"Identify one relationship or habit where you have stopped wiping. What is the smallest daily correction you can install starting today? Write the action and set a recurring alarm for it.",song:"Learning to Fly",artist:"Tom Petty",breath:false}

  }
  // CHECK-IN NUDGE (hasn\u2019t checked in, has history)
  var _ciDays=Object.keys(checkInZones).length;
  if(_ciDays>=3&&!checkedInToday()){
    ins.push({type:'pattern',icon:'\uD83D\uDCCA',text:'Your field status shapes today\u2019s card. Check in before you draw.'});
  }

  }

  var _tvTs={};try{_tvTs=JSON.parse(localStorage.getItem('od3_tv')||'{}')}catch(e){}
  var _tvKeys=Object.keys(_tvTs);var _now=Date.now();var _7d=7*24*60*60*1000;
  var _recentTools=_tvKeys.filter(function(k){return _now-_tvTs[k]<_7d;});

    ins.push({type:'pattern',icon:'\uD83D\uDD01',text:'You\u2019ve been using the same tools. Break the loop.',action:{label:'START PATTERN BREAK PROTOCOL',protocol:'pattern_break'}});

}

window.advanceProtocol=function(){
  if(!activeProtocol)return;
  var proto=PROTOCOLS[activeProtocol.key];
  activeProtocol.step+=1;
  if(activeProtocol.step>=proto.steps.length){
    var completed=activeProtocol.key;
    activeProtocol=null;
    odDel('active_protocol');
    showToast('\u2713 '+PROTOCOLS[completed].exit,{bg:'#1a3a1a',color:'#6fcf6f',duration:3500});
    R();
    return;
  }
  odSet('active_protocol',activeProtocol);
  R();
};

window.runProtocolStep=function(){
  if(!activeProtocol)return;
  var proto=PROTOCOLS[activeProtocol.key];
  var step=proto.steps[activeProtocol.step];
  if(step.type==='tool'){
    // Write sync marker — resolved on return, not before navigation
    try{localStorage.setItem('od_protocol_pending',JSON.stringify({key:activeProtocol.key,step:activeProtocol.step}));}catch(e){}

  }

};

// ── SYSTEM INTEGRITY CHECK — run window.odIntegrity() in console ──
window.odIntegrity=async function(){
  var _p=0,_f=0,_w=0;
  var OK =function(s){console.log('%c ✓ '+s,'color:#27ae60;font-family:monospace');_p++};
  var FAIL=function(s){console.log('%c ✗ '+s,'color:#c0392b;font-family:monospace;font-weight:bold');_f++};
  var WARN=function(s){console.log('%c ⚠ '+s,'color:#d4a843;font-family:monospace');_w++};
  console.log('%cOD INTEGRITY CHECK','background:#08080f;color:#d4a843;font-weight:bold;font-family:monospace;font-size:13px;padding:4px 8px');
  // 1 — Vault round-trip
  try{
    await initVault();
    var _enc=await encryptValue('_test');
    var _dec=await decryptValue(_enc);
    if(_dec==='_test'){OK('Vault encrypt/decrypt round-trip')}
    else{FAIL('Vault round-trip value mismatch')}
  }catch(e){FAIL('Vault failed: '+e.message);console.log('Cannot continue.');return{pass:_p,warn:_w,fail:_f}}
  // 2 — Critical vault keys decrypt
  var _VK=['od3','od3ev','od3ob','od3mr','od3sp'];
  for(var _i=0;_i<_VK.length;_i++){
    var _k=_VK[_i],_raw=localStorage.getItem(_k);
    if(!_raw){WARN(_k+' — not set (first-run OK)');continue}
    try{await decryptValue(_raw);OK(_k+' — decrypts OK')}
    catch(e){FAIL(_k+' — DECRYPT FAILED (plaintext or corrupt)')}
  }
  // 3 — od3 is not stored as plaintext object
  var _od3raw=localStorage.getItem('od3');
  if(_od3raw){
    try{var _pj=JSON.parse(_od3raw);if(_pj&&typeof _pj==='object'){FAIL('od3 stored as PLAINTEXT object — not encrypted')}else{OK('od3 is not plaintext JSON object')}}
    catch(e){OK('od3 stored as encrypted blob (JSON.parse rejected)')}
  }
  // 4 — migration flag
  if(localStorage.getItem('od_migrated_v1')==='1'){OK('Migration flag set')}
  else{WARN('Migration not yet run (first-run OK)')}
  // 5 — activeProtocol step in bounds
  try{
    var _ap=await odGet('active_protocol',null);
    if(_ap){
      var _pr=PROTOCOLS[_ap.key];
      if(!_pr){FAIL('activeProtocol key "'+_ap.key+'" not in PROTOCOLS')}
      else if(_ap.step<0||_ap.step>=_pr.steps.length){FAIL('activeProtocol step '+_ap.step+' out of bounds (max '+(_pr.steps.length-1)+')')}
      else{OK('activeProtocol "'+_ap.key+'" step '+_ap.step+'/'+(_pr.steps.length-1)+' in bounds')}
    }else{OK('activeProtocol — none active')}
  }catch(e){FAIL('activeProtocol check: '+e.message)}
  // 6 — checkInZones structure
  var _CI=['mood','attitude','sleep','physical','activity','substance'];
  var _cizKeys=Object.keys(checkInZones),_bad=0;
  _cizKeys.forEach(function(d){var z=checkInZones[d];if(!z||typeof z!=='object'){_bad++;return}_CI.forEach(function(k){if(z[k]&&['h','r','i','l'].indexOf(z[k])===-1)_bad++})});
  if(_bad>0){WARN('checkInZones has '+_bad+' malformed value(s)')}
  else{OK('checkInZones OK ('+_cizKeys.length+' entries)')}
  // 7 — evidence entries all have tx field
  var _noTx=evidence.filter(function(e){return typeof e.tx!=='string'});
  if(_noTx.length>0){FAIL('Evidence: '+_noTx.length+'/'+evidence.length+' entries missing tx field')}
  else{OK('Evidence: all '+evidence.length+' entries have tx field')}
  // 8 — IntelEngine reads data
  try{
    if(typeof IntelEngine!=='undefined'){
      var _brief=IntelEngine.generateBrief();
      var _hasDrill=localStorage.getItem('od_cbt_records')||localStorage.getItem('od_protocol_logs')||localStorage.getItem('od_wgo_logs');
      if(_hasDrill&&(!_brief||_brief.indexOf('BASELINE COLLECTING')>-1&&!_hasDrill)){WARN('IntelEngine returned minimal brief despite drill data')}
      else if(_brief){OK('IntelEngine brief generated ('+_brief.length+' chars)')}
      else{WARN('IntelEngine brief null — no drill data yet (first-run OK)')}
    }else{WARN('IntelEngine not loaded on this page')}
  }catch(e){FAIL('IntelEngine check: '+e.message)}
  // — Summary
  console.log('%c────────────────────────────────','color:#333');
  var _col=_f>0?'#c0392b':_w>0?'#d4a843':'#27ae60';
  console.log('%c PASS: '+_p+'  WARN: '+_w+'  FAIL: '+_f,'color:'+_col+';font-weight:bold;font-family:monospace;font-size:12px');
  return{pass:_p,warn:_w,fail:_f};
};
