# Neon Circuit Room Authority Mesh
# Worker + Durable Objects for serverless room/cabinet authority.
# This is a separate project from the static Cloudflare Pages site.

name = "neon-arcade-mesh"
main = "src/index.ts"
compatibility_date = "2026-05-31"

# Durable Object bindings.
# Phase 2b: per-room sharding — one ArcadeRoom instance per room (idFromName(roomId)).
# RoomRegistry is a single coordinator instance that aggregates per-room population
# and owns admin status overrides for the room-lifecycle tooling.
# Phase 2c: room DOs report a periodic HEARTBEAT to the registry, which derives
# per-room health (healthy/stale/offline) + evicts stale population. No new bindings.
# Phase 4A: CityRoom is a SEPARATE, isolated DO for the top-down city-block prototype.
# It is per-block sharded (idFromName(cityId)), never talks to the RoomRegistry, and
# never touches arcade occupancy/ticket state — so the arcade authority is unchanged.
[durable_objects]
bindings = [
  { name = "ARCADE_ROOM", class_name = "ArcadeRoom" },
  { name = "ROOM_REGISTRY", class_name = "RoomRegistry" },
  { name = "CITY_ROOM", class_name = "CityRoom" },
  { name = "CITY_REGISTRY", class_name = "CityRegistry" }
]

# SQLite-backed Durable Objects (recommended for new classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArcadeRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomRegistry"]

# Phase 4A: city-block authority DO (additive; declared here, only RUN on a deploy).
[[migrations]]
tag = "v3"
new_sqlite_classes = ["CityRoom"]

# Phase 5C: city-block presence coordinator DO (additive; only RUN on a deploy).
[[migrations]]
tag = "v4"
new_sqlite_classes = ["CityRegistry"]

# Local development settings.
[vars]
ENVIRONMENT = "development"
# Phase 2b admin dev flag. Admin/reset ops ALSO require a matching ADMIN_TOKEN
# secret (set via `wrangler secret put ADMIN_TOKEN`, or a dev env var) — admin is
# OFF unless BOTH are configured. The token is NEVER committed to the repo.
ADMIN_ENABLED = "true"

# ADMIN_TOKEN is intentionally NOT defined here. Configure it out-of-band:
#   prod: wrangler secret put ADMIN_TOKEN --env production
#   dev:  wrangler dev --var ADMIN_TOKEN:<token>   (or a gitignored .dev.vars)

# ===================== Phase 3A: production environment =====================
# Deploy production with:  wrangler deploy --env production
#
# Named Wrangler environments do NOT inherit top-level `vars`, `durable_objects`,
# or `migrations` — each must be re-declared here, or the production Worker would
# ship with the dev defaults / no DO bindings. (Verified via `--env production
# --dry-run`.) This block makes a production deploy safe BY DEFAULT:
#   * ENVIRONMENT = "production"  → rejects the __test_set_event_now event-clock hook
#   * ADMIN_ENABLED = "false"     → admin/live-ops surface OFF (and still needs a
#                                   separately-configured ADMIN_TOKEN secret to ever be on)
#   * EVENT_* are the display-only presentation defaults (clamped server-side).
# ADMIN_TOKEN is NEVER set here — configure it out-of-band only if you intend to
# enable live-ops:  wrangler secret put ADMIN_TOKEN --env production
#
# Phase 5 launch routing — NARROW same-origin routes. Only the Worker's API/WS endpoints
# under /arcade/ hit this DO Worker; the static client (incl. /arcade/city/*) stays on the
# `wild-hat-6257` assets Worker that owns the clovelearn.io custom domain. This is NOT a
# broad clovelearn.io/arcade/* — that would route the static client files to this Worker,
# which 404s anything but these 5 endpoints.
#
# IMPORTANT: every pattern ends in `*`. A Cloudflare route WITHOUT a trailing `*` matches
# the path ONLY when there is no query string — so a bare `clovelearn.io/arcade/city/ws`
# does NOT match the client's real `/arcade/city/ws?city=<id>` (verified: bare → 404 with
# query, → Worker without). The `*` absorbs the `?room=`/`?city=` query. None of these
# patterns shadow a static file (no asset path starts with ws/city/ws/rooms/health).
[env.production]
routes = [
  { pattern = "clovelearn.io/arcade/ws*",      zone_name = "clovelearn.io" },
  { pattern = "clovelearn.io/arcade/city/ws*", zone_name = "clovelearn.io" },
  { pattern = "clovelearn.io/arcade/rooms*",   zone_name = "clovelearn.io" },
  { pattern = "clovelearn.io/arcade/health*",  zone_name = "clovelearn.io" },
]

[env.production.vars]
ENVIRONMENT = "production"
ADMIN_ENABLED = "false"
EVENT_PREROLL_LEAD_MS = "120000"
EVENT_COUNTDOWN_REFRESH_MS = "1000"
EVENT_SHOW_NEXT = "true"
EVENT_SHOW_FEATURED = "true"

[env.production.durable_objects]
bindings = [
  { name = "ARCADE_ROOM", class_name = "ArcadeRoom" },
  { name = "ROOM_REGISTRY", class_name = "RoomRegistry" },
  { name = "CITY_ROOM", class_name = "CityRoom" },
  { name = "CITY_REGISTRY", class_name = "CityRegistry" }
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ArcadeRoom"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["RoomRegistry"]

[[env.production.migrations]]
tag = "v3"
new_sqlite_classes = ["CityRoom"]

[[env.production.migrations]]
tag = "v4"
new_sqlite_classes = ["CityRegistry"]

# ===================== Phase 3 (staging): pre-production environment =====================
# Deploy staging with:  wrangler deploy --env staging   →  Worker `neon-arcade-mesh-staging`.
# A SAFE, separate target for the pre-production remote smoke. Like production, named envs
# do NOT inherit top-level vars/durable_objects/migrations, so they are re-declared here.
#   * ENVIRONMENT = "staging"  → a NON-"development" value, so the __test_set_event_now
#     event-clock hook is rejected (the code only honors it when ENVIRONMENT === "development").
#   * ADMIN_ENABLED = "false"  → admin/live-ops surface OFF by default (and still needs a
#     separately-configured ADMIN_TOKEN secret to ever be on).
#   * EVENT_* are the display-only presentation defaults (clamped server-side).
# ADMIN_TOKEN is NEVER set here. Staging is a DISTINCT Worker + DO namespace from production.
[env.staging]
name = "neon-arcade-mesh-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ADMIN_ENABLED = "false"
EVENT_PREROLL_LEAD_MS = "120000"
EVENT_COUNTDOWN_REFRESH_MS = "1000"
EVENT_SHOW_NEXT = "true"
EVENT_SHOW_FEATURED = "true"

[env.staging.durable_objects]
bindings = [
  { name = "ARCADE_ROOM", class_name = "ArcadeRoom" },
  { name = "ROOM_REGISTRY", class_name = "RoomRegistry" },
  { name = "CITY_ROOM", class_name = "CityRoom" },
  { name = "CITY_REGISTRY", class_name = "CityRegistry" }
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ArcadeRoom"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["RoomRegistry"]

[[env.staging.migrations]]
tag = "v3"
new_sqlite_classes = ["CityRoom"]

[[env.staging.migrations]]
tag = "v4"
new_sqlite_classes = ["CityRegistry"]
