# Neon Circuit Room Authority Mesh
# Worker + Durable Objects for serverless room/cabinet authority.
# This is a separate project from the static Cloudflare Pages site.

name = "neon-arcade-mesh"
main = "src/index.ts"
compatibility_date = "2026-05-31"

[durable_objects]
bindings = [
  { name = "ARCADE_ROOM", class_name = "ArcadeRoom" },
  { name = "ROOM_REGISTRY", class_name = "RoomRegistry" },
  { name = "CITY_ROOM", class_name = "CityRoom" },
  { name = "CITY_REGISTRY", class_name = "CityRegistry" },
  { name = "PAPER_FIRM_ROOM", class_name = "PaperFirmRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArcadeRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomRegistry"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CityRoom"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["CityRegistry"]

# Paper Firm First Shift field authority. Additive and isolated from RUG org truth.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["PaperFirmRoom"]

[vars]
ENVIRONMENT = "development"
ADMIN_ENABLED = "true"
# Local prototype secret only. Production/staging intentionally require a real secret:
#   wrangler secret put PAPER_FIRM_RECEIPT_SECRET --env production
#   wrangler secret put PAPER_FIRM_RECEIPT_SECRET --env staging
PAPER_FIRM_RECEIPT_SECRET = "paper-firm-local-dev-secret-change-me"

# ADMIN_TOKEN is intentionally NOT defined here. Configure it out-of-band.

[env.production]
name = "neon-arcade-mesh-production"
routes = [
  { pattern = "clovelearn.io/arcade/ws*",                zone_name = "clovelearn.io" },
  { pattern = "clovelearn.io/arcade/city/ws*",           zone_name = "clovelearn.io" },
  { pattern = "clovelearn.io/arcade/paper-firm/ws*",     zone_name = "clovelearn.io" },
  { pattern = "clovelearn.io/arcade/rooms*",             zone_name = "clovelearn.io" },
  { pattern = "clovelearn.io/arcade/health*",            zone_name = "clovelearn.io" },
]

[env.production.vars]
ENVIRONMENT = "production"
ADMIN_ENABLED = "false"
EVENT_PREROLL_LEAD_MS = "120000"
EVENT_COUNTDOWN_REFRESH_MS = "1000"
EVENT_SHOW_NEXT = "true"
EVENT_SHOW_FEATURED = "true"

[env.production.durable_objects]
bindings = [
  { name = "ARCADE_ROOM", class_name = "ArcadeRoom" },
  { name = "ROOM_REGISTRY", class_name = "RoomRegistry" },
  { name = "CITY_ROOM", class_name = "CityRoom" },
  { name = "CITY_REGISTRY", class_name = "CityRegistry" },
  { name = "PAPER_FIRM_ROOM", class_name = "PaperFirmRoom" }
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ArcadeRoom"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["RoomRegistry"]

[[env.production.migrations]]
tag = "v3"
new_sqlite_classes = ["CityRoom"]

[[env.production.migrations]]
tag = "v4"
new_sqlite_classes = ["CityRegistry"]

[[env.production.migrations]]
tag = "v5"
new_sqlite_classes = ["PaperFirmRoom"]

[env.staging]
name = "neon-arcade-mesh-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
ADMIN_ENABLED = "false"
EVENT_PREROLL_LEAD_MS = "120000"
EVENT_COUNTDOWN_REFRESH_MS = "1000"
EVENT_SHOW_NEXT = "true"
EVENT_SHOW_FEATURED = "true"

[env.staging.durable_objects]
bindings = [
  { name = "ARCADE_ROOM", class_name = "ArcadeRoom" },
  { name = "ROOM_REGISTRY", class_name = "RoomRegistry" },
  { name = "CITY_ROOM", class_name = "CityRoom" },
  { name = "CITY_REGISTRY", class_name = "CityRegistry" },
  { name = "PAPER_FIRM_ROOM", class_name = "PaperFirmRoom" }
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ArcadeRoom"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["RoomRegistry"]

[[env.staging.migrations]]
tag = "v3"
new_sqlite_classes = ["CityRoom"]

[[env.staging.migrations]]
tag = "v4"
new_sqlite_classes = ["CityRegistry"]

[[env.staging.migrations]]
tag = "v5"
new_sqlite_classes = ["PaperFirmRoom"]
