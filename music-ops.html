function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}

function jg(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function js(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function loadTok(){const t=jg(KT);return(t&&t.access_token)?t:null}
async function refreshTok(t){try{const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:t.refresh_token,client_id:CLIENT_ID})});const d=await r.json();if(d.access_token){const n={access_token:d.access_token,refresh_token:d.refresh_token||t.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000};js(KT,n);return n}}catch(e){}return null}
async function getTok(){let t=loadTok();if(!t)return null;if(Date.now()>t.expires_at-60000)t=await refreshTok(t);return t}

function b64u(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'')}
async function startAuth(){const v=b64u(crypto.getRandomValues(new Uint8Array(64)).buffer);const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));js(KCV,v);window.location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,code_challenge_method:'S256',code_challenge:ch,state:'od-spotify',scope:SCOPES})}
async function handleCB(code){sync(1,5,'EXCHANGING CREDENTIALS');const v=jg(KCV);if(!v){err('Session expired \u2014 reconnect.');return}try{const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,client_id:CLIENT_ID,code_verifier:v})});const d=await r.json();if(!d.access_token)throw new Error(d.error_description||'Auth failed');js(KT,{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000});localStorage.removeItem(KCV);history.replaceState({},'','./music-ops.html');await runSync()}catch(e){err('Auth failed: '+e.message)}}

async function api(tok,ep){const r=await fetch('https://api.spotify.com/v1'+ep,{headers:{Authorization:'Bearer '+tok.access_token}});if(r.status===401)throw new Error('Token expired');if(r.status===429){await sleep((parseInt(r.headers.get('Retry-After')||'3'))*1000);return api(tok,ep)}if(!r.ok)throw new Error('API '+r.status+' on '+ep);return r.json()}

// ── GENRE MATCHING ENGINE ────────────────────────────────────────────────
// Score: count of genre tokens that overlap between user artist and reference artist.
// Partial match counts (e.g. "metal" matches "heavy metal", "thrash metal", etc.)
function genreScore(userG,refG){
  if(!userG||!userG.length||!refG||!refG.length)return 0;
  let hits=0;
  userG.forEach(ug=>{refG.forEach(rg=>{if(ug===rg||ug.includes(rg)||rg.includes(ug))hits++})});
  return hits;
}

function bestGenreMatch(refGenres,library){
  let best=null,bestScore=-1;
  library.forEach(t=>{
    const s=genreScore(t.genres||[],refGenres);
    if(s>bestScore){bestScore=s;best=t}
  });
  // If no genre overlap found, fall back to most popular track
  if(bestScore===0){
    let maxPop=0;
    library.forEach(t=>{if((t.popularity||0)>maxPop){maxPop=t.popularity||0;best=t}});
  }
  return best?{...best,genreScore:bestScore,sharedGenres:(best.genres||[]).filter(ug=>refGenres.some(rg=>ug===rg||ug.includes(rg)||rg.includes(ug)))}:null;
}

async function runSync(){
  const tok=await getTok();
  if(!tok){err('Session lost \u2014 reconnect.');return}
  try{
    // PHASE 1 — User Library
    sync(1,10,'PULLING YOUR TOP TRACKS');
    const[t1,t2,sv]=await Promise.all([
      api(tok,'/me/top/tracks?limit=50&time_range=medium_term'),
      api(tok,'/me/top/tracks?limit=50&time_range=short_term'),
      api(tok,'/me/tracks?limit=50')
    ]);
    const seen=new Set(),all=[];
    const add=t=>{if(t&&t.id&&!seen.has(t.id)){seen.add(t.id);all.push({id:t.id,name:t.name,artist:t.artists?.[0]?.name||'',artistId:t.artists?.[0]?.id||'',uri:t.uri,image:t.album?.images?.[1]?.url||t.album?.images?.[0]?.url||'',popularity:t.popularity||0})}};
    (t1.items||[]).forEach(add);(t2.items||[]).forEach(add);(sv.items||[]).map(i=>i.track).filter(Boolean).forEach(add);

    // Get artist genres for user library
    sync(1,22,'FETCHING ARTIST GENRE DATA');
    const uniqueArtistIds=[...new Set(all.map(t=>t.artistId).filter(Boolean))];
    const artistGenreMap={};
    for(let i=0;i<uniqueArtistIds.length;i+=50){
      const ids=uniqueArtistIds.slice(i,i+50).join(',');
      try{const ar=await api(tok,'/artists?ids='+ids);(ar.artists||[]).forEach(a=>{if(a&&a.id)artistGenreMap[a.id]=a.genres||[]})}catch(e){}
      await sleep(80);
    }
    const library=all.map(t=>({...t,genres:artistGenreMap[t.artistId]||[]}));
    js(KTR,library);LIB=library;

    // PHASE 2 — Reference artist genres via search
    sync(2,32,'LOOKING UP 115 REFERENCE ARTISTS');
    const refs={};
    const B=8;
    for(let i=0;i<KEYS.length;i+=B){
      const batch=KEYS.slice(i,i+B);
      sync(2,32+Math.round((i/KEYS.length)*35),'REFERENCE LOOKUP '+i+'/'+KEYS.length);
      await Promise.all(batch.map(async k=>{
        const sd=SEEDS[k];
        try{
          const q=encodeURIComponent('artist:'+sd.artist+' track:'+sd.song);
          const res=await api(tok,'/search?q='+q+'&type=track&limit=1');
          const tr=res?.tracks?.items?.[0];
          if(tr&&tr.artists?.[0]?.id){
            const artRes=await api(tok,'/artists/'+tr.artists[0].id);
            refs[k]=artRes.genres||SUIT_GENRES[sd.s]||[];
          } else {
            refs[k]=SUIT_GENRES[sd.s]||[];
          }
        }catch(e){refs[k]=SUIT_GENRES[sd.s]||[]}
      }));
      if(i+B<KEYS.length)await sleep(120);
    }
    js(KR,refs);REFS=refs;

    // PHASE 3 — Greedy no-dupe assignment
    // Build every card×track score pair, sort best-first, assign once per track.
    sync(3,75,'MATCHING 115 CARDS \u2014 NO DUPLICATES');
    const M={};
    const triples=[];
    KEYS.forEach(k=>{
      const refG=refs[k]||SUIT_GENRES[SEEDS[k].s]||[];
      library.forEach(t=>{
        const s=genreScore(t.genres||[],refG);
        triples.push({k,t,s});
      });
    });
    triples.sort((a,b)=>b.s-a.s);
    const doneCards=new Set(),usedTracks=new Set();
    for(const {k,t,s} of triples){
      if(!doneCards.has(k)&&!usedTracks.has(t.id)){
        const refG=refs[k]||SUIT_GENRES[SEEDS[k].s]||[];
        M[k]={...t,genreScore:s,sharedGenres:(t.genres||[]).filter(ug=>refG.some(rg=>ug===rg||ug.includes(rg)||rg.includes(ug))),dupe:false};
        doneCards.add(k);usedTracks.add(t.id);
      }
      if(doneCards.size===KEYS.length)break;
    }
    // Fallback for cards still unmatched (library smaller than card count)
    KEYS.forEach(k=>{
      if(!M[k]){
        const refG=refs[k]||SUIT_GENRES[SEEDS[k].s]||[];
        const m=bestGenreMatch(refG,library);
        if(m)M[k]={...m,dupe:true};
      }
    });
    js(KM,M);js(KS,Date.now());MATCHES=M;
    const mc=Object.keys(M).length;
    ST='connected';render();
    toast('SYNC COMPLETE \u2014 '+mc+'/115 CARDS MATCHED');
  }catch(e){err('Sync failed: '+e.message+'. Try re-syncing.')}
}

function sync(ph,pr,msg){SH=ph;SP=pr;SM=msg;ST='syncing';render()}
function err(msg){EM=msg;ST='error';render()}

function downloadCSV(){
  const rows=[['Card Key','Suit','Number','Card Title','Reference Song','Reference Artist','Reference Genres','Your Matched Track','Your Artist','Your Track Genres','Shared Genres','Genre Match Score','Fallback Dupe','Spotify URI']];
  KEYS.forEach(k=>{
    const sd=SEEDS[k],m=MATCHES[k],rg=(REFS[k]||[]).join('; ');
    rows.push([k,sd.s,sd.n,sd.t,sd.song,sd.artist,rg,m?.name||'',m?.artist||'',(m?.genres||[]).join('; '),(m?.sharedGenres||[]).join('; '),m?.genreScore||0,m?.dupe?'YES':'NO',m?'https://open.spotify.com/track/'+m.id:'']);
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='operators-deck-field-frequency.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV DOWNLOADED');
}

    setStatus('off','\u25cf NOT CONNECTED');
    root.innerHTML='<div class="cp"><h2>CONNECT YOUR LIBRARY</h2><p>Each of your 115 cards gets matched to a track from your Spotify library by genre fingerprint. The deck\u2019s curated songs identify each card\u2019s sonic territory \u2014 your library fills the slot.</p><button class="cbtn" onclick="startAuth()">CONNECT SPOTIFY \u2192</button><div class="cnote">Read-only \u00b7 No playlist changes \u00b7 Token expires 1 hr<br>Revoke anytime at spotify.com/account/apps</div></div><div class="priv"><div class="pt">\uD83D\uDD12 Token and all track data stored only on this device. Nothing leaves it.</div></div>';return;
  }
  if(ST==='syncing'){
    setStatus('busy','\u25ce SYNCING');
    root.innerHTML='<div class="syncp"><div class="stag">BUILDING YOUR SOUNDTRACK</div><div class="sphases">'+['LIBRARY','REFERENCES','MATCHING'].map((l,i)=>'<div class="sph"><div class="d '+(i+1<SH?'done':i+1===SH?'act':'')+'"></div><div class="l">'+l+'</div></div>').join('')+'</div><div class="sbar"><div class="sfill" style="width:'+SP+'%"></div></div><div class="smsg">'+esc(SM)+'</div><div class="snote">Runs once \u00b7 Stored locally \u00b7 ~40 seconds</div></div><div class="priv"><div class="pt">\uD83D\uDD12 Track data stays on device only.</div></div>';return;
  }
  if(ST==='error'){
    setStatus('off','\u26a0 ERROR');
    root.innerHTML='<div class="ep"><div class="etag">SYNC FAILED</div><div class="emsg">'+esc(EM)+'</div><button class="rbtn" onclick="startAuth()">RECONNECT \u2192</button></div>';return;
  }
  // CONNECTED
  const sd=jg(KS)?new Date(jg(KS)).toLocaleDateString('en-CA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  const mc=Object.keys(MATCHES).length,uniq=new Set(Object.values(MATCHES).map(m=>m.id)).size;
  const fkeys=SUIT==='all'?KEYS:KEYS.filter(k=>SEEDS[k].s===SUIT);
  const suits=['all',...Object.keys(SUIT_META)];
  setStatus('on','\u25cf CONNECTED \u00b7 '+mc+'/115 MATCHED');
  let h='<div class="stats"><div class="stb"><div class="v">'+mc+'</div><div class="l">MATCHED</div></div><div class="stb"><div class="v">'+LIB.length+'</div><div class="l">YOUR TRACKS</div></div><div class="stb"><div class="v">'+uniq+'</div><div class="l">UNIQUE SONGS</div></div></div>';
  h+='<div class="acts"><button class="abtn adl" onclick="downloadCSV()">\u2193 EXPORT CSV</button><button class="abtn ars" onclick="runSync()">\u27f3 RE-SYNC</button><button class="abtn adc" onclick="disconnect()">\u2715</button></div>';
  if(sd)h+='<div style="text-align:center;margin:6px 0 0;color:var(--dim2);font-size:6.5px;font-family:\'DM Mono\',monospace;letter-spacing:1px">LAST SYNCED '+sd+'</div>';
  h+='<div class="filters">'+suits.map(s=>{const meta=SUIT_META[s];const lbl=s==='all'?'ALL SUITS':(meta.sym+' '+meta.name);return'<div class="ftab'+(SUIT===s?' on':'')+'" onclick="setSuit(\''+s+'\')">'+esc(lbl)+'</div>'}).join('')+'</div>';
  h+='<div class="secrow"><span class="sl">CARD ASSIGNMENTS</span><span class="sr">'+fkeys.length+' CARDS</span></div>';
  fkeys.forEach(k=>{
    const seed=SEEDS[k],m=MATCHES[k],meta=SUIT_META[seed.s]||SUIT_META.joker;
    const uri=m?'https://open.spotify.com/track/'+m.id:'';
    const shared=m?.sharedGenres||[];
    const allTags=(m?.genres||[]).slice(0,4);
    h+='<div class="cm'+(m?' hit':'')+'"><div class="cmh"><div class="sym" style="color:'+meta.color+'">'+meta.sym+'</div><div><div class="cid" style="color:'+meta.color+'">'+esc(meta.name)+' \u00b7 '+esc(seed.n)+'</div><div class="ttl">'+esc(seed.t)+'</div></div><div class="ref">'+esc(seed.song)+'</div></div>';
    if(m){
      const img=m.image;
      h+='<div class="cmb">'+(img?'<img class="art" src="'+esc(img)+'" alt="" loading="lazy">':`<div class="artph">&#9835;</div>`)+'<div class="inf"><div class="sng">'+esc(m.name)+'</div><div class="art2">'+esc(m.artist)+'</div><div class="gtags">'+allTags.map(g=>'<span class="gtag'+(shared.includes(g)?' match':'')+'">' +esc(g)+'</span>').join('')+(m.genreScore===0?'<span class="gtag">popularity match</span>':'')+(m.dupe?'<span class="gtag" style="color:var(--gld);border-color:rgba(212,168,67,.2)">\u2605 fallback</span>':'')+'</div></div><button class="play" onclick="window.open(\''+esc(uri)+'\',\'_blank\')">\u25b6</button></div>';
    } else {
      h+='<div class="empty">No match found.</div>';
    }
    h+='</div>';
  });
  root.innerHTML=h;
}

async function init(){
