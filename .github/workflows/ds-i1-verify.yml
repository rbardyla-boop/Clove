name: DS-I1 Verify

on:
  push:
    branches:
      - build/ds-i1-survive-forced-grid-2026-08-12
  pull_request:
    paths:
      - 'digital-stewardship-01.html'
      - 'digital-stewardship-01.js'
      - 'tests/static/ds-i1-*'
      - 'scripts/build-production-upload.mjs'
      - 'scripts/release-preflight.mjs'
      - '.github/workflows/ds-i1-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-i1-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static privacy/safety contract
        run: node --test tests/static/ds-i1-contract.test.mjs
      - name: Branch-aware state oracle
        run: node --test tests/static/ds-i1-state-machine.test.mjs
      - name: Deliberate bad-variant rejection
        run: node --test tests/static/ds-i1-mutation.test.mjs
      - name: Non-public production boundary
        run: node --test tests/static/ds-i1-release-boundary.test.mjs
      - name: Existing production preflight
        run: node scripts/release-preflight.mjs
      - name: JavaScript syntax
        run: node --check digital-stewardship-01.js
      - name: Install browser-test dependency
        run: npm ci
      - name: Chromium replay
        run: node --test tests/static/ds-i1-browser.test.mjs
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Firefox replay
        env:
          DS_BROWSER: firefox
        run: node --test tests/static/ds-i1-browser.test.mjs
