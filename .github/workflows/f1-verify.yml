name: F1 Mission Verify

on:
  push:
    branches:
      - f0/brotherhood-salvage-audit-2026-08-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mission static acceptance contract
        run: node --test tests/static/mission-001-contract.test.mjs

      - name: Extract Mission 001 browser script
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('mission-001.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('mission_script_missing');
          fs.writeFileSync('/tmp/mission-001.js', scripts.at(-1)[1]);
          NODE

      - name: Mission JavaScript syntax check
        run: node --check /tmp/mission-001.js

      - name: Install root verification dependency
        run: npm ci

      - name: Mission browser acceptance replay
        run: npm run test:mission-browser

      - name: Install Insights verification dependencies
        run: npm ci --prefix workers/insights

      - name: Insights dependency audit snapshot
        run: npm audit --prefix workers/insights --json || true

      - name: Insights typecheck and privacy-contract tests
        run: npm --prefix workers/insights run check
