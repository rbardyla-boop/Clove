name: F1 Mission Verify

on:
  push:
    branches:
      - main
      - hardening/mission-001-solo-2026-08-12
  pull_request:
    paths:
      - 'mission-001.html'
      - 'mission-001-app.js'
      - 'mission-private-store.js'
      - 'tests/static/mission-*'
      - 'workers/insights/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/f1-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-mission-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mission static acceptance contract
        run: npm run test:mission

      - name: Mission formal state-machine and negative controls
        run: npm run test:mission-state

      - name: Mission HTML references encrypted persistence scripts
        run: |
          grep -F '<script src="mission-private-store.js"></script>' mission-001.html
          grep -F '<script src="mission-001-app.js"></script>' mission-001.html
          if grep -F 'function save(next){state=next;try{localStorage.setItem(KEY' mission-001.html; then
            echo 'Legacy plaintext persistence controller still present'
            exit 1
          fi

      - name: Mission JavaScript syntax checks
        run: |
          node --check mission-private-store.js
          node --check mission-001-app.js

      - name: Install exact root verification dependency
        run: npm ci

      - name: Mission Chromium acceptance replay
        run: npm run test:mission-browser

      - name: Mission persisted-state and storage-failure adversarial replay
        run: npm run test:mission-adversarial

      - name: Encrypted Mission store Chromium replay
        run: npm run test:mission-store-browser

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Mission Firefox compatibility replay
        run: npm run test:mission-firefox

      - name: Install exact Insights dependency graph
        run: npm ci --prefix workers/insights

      - name: Reject known Insights dependency vulnerabilities
        run: npm audit --prefix workers/insights --audit-level=low

      - name: Insights typecheck and privacy-contract tests
        run: npm --prefix workers/insights run check

      - name: Insights Wrangler build dry-run
        run: npm --prefix workers/insights run dry-run
