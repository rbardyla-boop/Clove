name: F1 Mission Verify

on:
  push:
    branches:
      - f0/brotherhood-salvage-audit-2026-08-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-f1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mission static acceptance contract
        run: node --test tests/static/mission-001-contract.test.mjs

      - name: Mission HTML references encrypted persistence scripts
        run: |
          grep -F '<script src="mission-private-store.js"></script>' mission-001.html
          grep -F '<script src="mission-001-app.js"></script>' mission-001.html
          if grep -F 'function save(next){state=next;try{localStorage.setItem(KEY' mission-001.html; then
            echo 'Legacy plaintext persistence controller still present'
            exit 1
          fi

      - name: Mission JavaScript syntax checks
        run: |
          node --check mission-private-store.js
          node --check mission-001-app.js

      - name: Install root verification dependency
        run: npm ci

      - name: Mission browser acceptance replay
        run: npm run test:mission-browser

      - name: Encrypted Mission store browser replay
        run: npm run test:mission-store-browser

      - name: Install Insights verification dependencies
        run: npm ci --prefix workers/insights

      - name: Insights dependency audit snapshot
        run: npm audit --prefix workers/insights --json || true

      - name: Diagnose available dependency repair without committing it
        run: |
          npm audit fix --package-lock-only --prefix workers/insights || true
          echo '--- candidate lockfile diff ---'
          git diff -- workers/insights/package.json workers/insights/package-lock.json || true
          echo '--- candidate versions ---'
          npm ci --prefix workers/insights
          npm ls --prefix workers/insights wrangler miniflare undici nanoid || true
          echo '--- post-fix audit ---'
          npm audit --prefix workers/insights --json || true

      - name: Restore repository lockfile before contract verification
        run: git checkout -- workers/insights/package.json workers/insights/package-lock.json

      - name: Reinstall exact repository dependencies
        run: npm ci --prefix workers/insights

      - name: Insights typecheck and privacy-contract tests
        run: npm --prefix workers/insights run check
