name: Repair DS-I2 Browser Assertion

on:
  push:
    branches:
      - build/ds-i2-identity-compartmentalization-2026-08-12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ds-i2-identity-compartmentalization-2026-08-12
      - name: Repair exact assertion and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/static/ds-i2-browser.test.mjs')
          text=p.read_text()
          old="/no critical account was moved|kept/i"
          new="/no critical account was moved|nothing critical was moved|kept/i"
          if new not in text:
              if old not in text:
                  raise SystemExit('assertion anchor missing')
              p.write_text(text.replace(old,new))
          PY
          git rm .github/workflows/repair-ds-i2-browser-assertion.yml
          git config user.name 'clove-ds-i2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/static/ds-i2-browser.test.mjs
          git commit -m 'test(ds-i2): accept equivalent no-migration wording'
          git push origin HEAD:build/ds-i2-identity-compartmentalization-2026-08-12
