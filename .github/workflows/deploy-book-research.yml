name: Deploy Book Research

on:
  push:
    branches:
      - release/book-research-live-2026-08-23
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clove-research-production
  cancel-in-progress: false

jobs:
  deploy-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Research Worker dependencies
        run: npm ci
        working-directory: workers/research

      - name: Research typecheck
        run: npm run check
        working-directory: workers/research

      - name: Research deterministic suite
        run: npm test
        working-directory: workers/research

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: workers/research

      - name: Require durable Cloudflare CI credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is not configured"
            exit 1
          fi

      - name: Deploy clove-research to production
        run: npx wrangler deploy --keep-vars --message "TDS book research archive public release 2026-08-23"
        working-directory: workers/research
