name: DS-I0 Verify

on:
  push:
    branches:
      - build/ds-i0-know-the-machine-2026-08-12
  pull_request:
    paths:
      - 'digital-stewardship-00.html'
      - 'digital-stewardship-00.js'
      - 'tests/static/ds-i0-*'
      - '.github/workflows/ds-i0-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-i0-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static privacy/copy contract
        run: node --test tests/static/ds-i0-contract.test.mjs

      - name: Formal state-machine and mutation controls
        run: node --test tests/static/ds-i0-state-machine.test.mjs

      - name: JavaScript syntax
        run: node --check digital-stewardship-00.js

      - name: Install exact browser-test dependency
        run: npm ci

      - name: Chromium replay
        run: node --test tests/static/ds-i0-browser.test.mjs

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Firefox replay
        env:
          DS_BROWSER: firefox
        run: node --test tests/static/ds-i0-browser.test.mjs
