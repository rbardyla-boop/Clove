name: DS-I0 Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-i0-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Static privacy/copy contract
        run: node --test tests/static/ds-i0-contract.test.mjs

      - name: Formal state-machine and mutation controls
        run: node --test tests/static/ds-i0-state-machine.test.mjs

      - name: Deliberate bad-variant rejection
        run: node --test tests/static/ds-i0-mutation.test.mjs

      - name: Non-public production-package boundary
        run: node --test tests/static/ds-i0-release-boundary.test.mjs

      - name: Existing production preflight remains green
        run: node scripts/release-preflight.mjs

      - name: JavaScript syntax
        run: node --check digital-stewardship-00.js

      - name: Install exact browser-test dependency
        run: npm ci

      - name: Chromium replay
        run: timeout 180s node --test --test-concurrency=1 tests/static/ds-i0-browser.test.mjs tests/static/ds-i0-adversarial.test.mjs

      - name: Install Firefox
        run: npx playwright install --with-deps firefox

      - name: Firefox replay
        env:
          DS_BROWSER: firefox
        run: timeout 180s node --test --test-concurrency=1 tests/static/ds-i0-browser.test.mjs tests/static/ds-i0-adversarial.test.mjs
