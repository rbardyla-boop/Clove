name: AIS F1 Poly Replay

on:
  push:
    branches: [ais-f1-replay-20260811]
  workflow_dispatch:

permissions:
  contents: read

# F1 forensic replay only. No adaptive routing or F2 work.
jobs:
  poly-r0-d4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact archived Poly revision
        uses: actions/checkout@v4
        with:
          repository: rbardyla-boop/poly
          ref: bbe8fa1edae877f7a9f957adbaba3568c2b3ba45
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Environment
        run: |
          python --version
          git rev-parse HEAD
      - name: Install trainer dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Replay exact R0-D4 trainer
        run: python research_zoo/r0_data/r0_d4_trainer.py
      - name: Replay D4 contract tests
        run: python -m unittest discover -s research_zoo/r0_data/tests -p 'test_r0_d4_contract.py' -v
