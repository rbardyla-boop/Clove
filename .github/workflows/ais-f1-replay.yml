name: AIS F1 Replay Focused

on:
  push:
    branches: [ais-f1-replay-20260811]
  workflow_dispatch:

permissions:
  contents: read

# F1 forensic replay only. Historical source is checked out verbatim.
# No adaptive routing, F2 work, or source repair.
jobs:
  powerplant-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rbardyla-boop/claude_powerplant
          ref: d024efa2bd0f0171c08eb1079983d81e77ab96b8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Environment
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install pinned dependencies
        run: npm ci
      - name: Replay AIS-relevant isolation and authority tests
        run: >-
          npx vitest run
          tests/skill-ingestion.test.ts
          tests/verification-integrity.test.ts
          tests/sanitized-workspace.test.ts
          tests/isolation-proof-report.test.ts
          tests/egress-boundary.test.ts
          tests/credential-boundary.test.ts
          tests/executor-launch-policy.test.ts
          tests/project-tool-broker.test.ts
          tests/tool-confirmation-policy.test.ts
          tests/queue-isolation-policy.test.ts
      - name: Replay type/build gate
        run: npm run build
