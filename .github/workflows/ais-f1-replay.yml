name: AIS F1 Powerplant Later Replay

on:
  push:
    branches: [ais-f1-replay-20260811]
  workflow_dispatch:

permissions:
  contents: read

# F1 forensic replay only. No adaptive routing or F2 work.
jobs:
  powerplant-later:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rbardyla-boop/claude_powerplant
          ref: 8c0c8d7e8c77a51ec7bd4ae6f846482f72e9acf9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Environment
        run: |
          node --version
          npm --version
          git rev-parse HEAD
      - name: Install pinned dependencies
        run: npm ci
      - name: Replay bounded-execution and verification subset
        run: >-
          npx vitest run
          tests/verification-integrity.test.ts
          tests/sanitized-workspace.test.ts
          tests/isolation-proof-report.test.ts
          tests/egress-boundary.test.ts
          tests/credential-boundary.test.ts
          tests/executor-launch-policy.test.ts
          tests/project-tool-broker.test.ts
          tests/tool-confirmation-policy.test.ts
          tests/queue-isolation-policy.test.ts
      - name: Replay build gate
        run: npm run build
