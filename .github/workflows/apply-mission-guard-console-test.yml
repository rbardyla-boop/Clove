name: Apply Mission Guard Console Test Patch

on:
  push:
    branches:
      - hardening/mission-001-solo-2026-08-12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/mission-001-solo-2026-08-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded test repair
        run: node scripts/patch-mission-guard-console-test.mjs
      - name: Commit only if changed
        run: |
          if git diff --quiet -- tests/static/mission-001-state-recovery-browser.test.mjs; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'clove-f1-2s-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/static/mission-001-state-recovery-browser.test.mjs
          git commit -m 'test(mission): scope guard console assertion to storage errors'
          git push origin HEAD:hardening/mission-001-solo-2026-08-12
