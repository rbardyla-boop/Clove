name: Apply DS-I2 Release Lock

on:
  push:
    branches:
      - build/ds-i2-identity-compartmentalization-2026-08-12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ds-i2-identity-compartmentalization-2026-08-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add exact DS-I2 release locks
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=[
            ['scripts/build-production-upload.mjs',
             "  'digital-stewardship-01.js',\n",
             "  'digital-stewardship-01.js',\n  'digital-stewardship-02.html',\n  'digital-stewardship-02.js',\n"],
            ['scripts/release-preflight.mjs',
             "  'digital-stewardship-01.js',\n",
             "  'digital-stewardship-01.js',\n  'digital-stewardship-02.html',\n  'digital-stewardship-02.js',\n"],
          ];
          for(const [path,from,to] of files){
            let text=fs.readFileSync(path,'utf8');
            if(text.includes("'digital-stewardship-02.html'")) continue;
            if(!text.includes(from)) throw new Error(`anchor missing: ${path}`);
            text=text.replace(from,to);
            fs.writeFileSync(path,text);
          }
          NODE
      - name: Remove temporary write workflow and commit exact repair
        run: |
          git rm .github/workflows/apply-ds-i2-release-lock.yml
          git config user.name 'clove-ds-i2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build-production-upload.mjs scripts/release-preflight.mjs
          git commit -m 'fix(release): hard-lock non-public DS-I2 slice'
          git push origin HEAD:build/ds-i2-identity-compartmentalization-2026-08-12
