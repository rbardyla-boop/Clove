name: Apply Product Audit Error Source

on:
  push:
    branches:
      - hardening/mission-001-solo-2026-08-12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/mission-001-solo-2026-08-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded diagnostic patch
        run: node scripts/patch-product-audit-error-source.mjs
      - name: Commit only if changed
        run: |
          if git diff --quiet -- scripts/product-audit.mjs; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'clove-f1-2s-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/product-audit.mjs
          git commit -m 'test(audit): report console error source URLs'
          git push origin HEAD:hardening/mission-001-solo-2026-08-12
