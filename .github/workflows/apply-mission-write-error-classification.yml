name: Apply Mission Write Error Classification

on:
  push:
    branches:
      - hardening/mission-001-solo-2026-08-12

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/mission-001-solo-2026-08-12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded classification repair
        run: node scripts/patch-mission-write-error-classification.mjs
      - name: Commit only repaired runtime and regression test
        run: |
          if git diff --quiet -- mission-001-app.js tests/static/mission-001-state-recovery-browser.test.mjs; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'clove-f1-2s-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mission-001-app.js tests/static/mission-001-state-recovery-browser.test.mjs
          git commit -m 'fix(mission): distinguish state guards from storage failures'
          git push origin HEAD:hardening/mission-001-solo-2026-08-12
