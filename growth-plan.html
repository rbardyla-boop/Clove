<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CloveLearn · Your Growth Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060d1a;
      --bg-card: rgba(10, 18, 36, 0.78);
      --bg-card-strong: rgba(12, 22, 42, 0.92);
      --ink: #e6edff;
      --ink-dim: rgba(210, 230, 255, 0.62);
      --ink-faint: rgba(210, 230, 255, 0.32);
      --line: rgba(96, 165, 250, 0.14);
      --line-strong: rgba(96, 165, 250, 0.34);
      --teal: #2ec4b6;
      --blue: #60a5fa;
      --grad: linear-gradient(95deg, #60a5fa 0%, #2ec4b6 100%);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%; overflow-x: hidden;
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(46, 196, 182, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(46, 196, 182, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: grid-drift 22s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      top: 20%; left: 50%;
      width: 720px; height: 720px;
      transform: translateX(-50%);
      background: radial-gradient(circle at center, rgba(46,196,182,0.10) 0%, rgba(96,165,250,0.06) 35%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(20px);
    }
    @keyframes grid-drift {
      from { background-position: 0 0; }
      to   { background-position: 48px 48px; }
    }

    .app {
      position: relative; z-index: 1;
      min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: max(32px, env(safe-area-inset-top)) 20px max(48px, env(safe-area-inset-bottom));
      max-width: 560px;
      margin: 0 auto;
    }

    /* Typography */
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--teal);
      margin-bottom: 10px;
    }
    h1.title { font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance; margin-bottom: 8px; }
    h1.title.big { font-size: 38px; letter-spacing: -0.03em; font-weight: 700; }
    .lede { font-size: 15px; line-height: 1.55; color: var(--ink-dim); }

    .section { margin-top: 20px; }

    /* Streak card */
    .streak-card {
      background: linear-gradient(180deg, rgba(46,196,182,0.08), rgba(96,165,250,0.04));
      border: 1px solid rgba(46,196,182,0.25);
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
    }
    .streak-num {
      font-size: 72px; font-weight: 700;
      letter-spacing: -0.04em;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .streak-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.2em;
      color: var(--ink-dim); text-transform: uppercase; margin-top: 4px;
    }
    .streak-bar-wrap {
      height: 4px; background: rgba(96,165,250,0.12);
      border-radius: 999px; overflow: hidden; margin-top: 20px;
    }
    .streak-bar {
      height: 100%; background: var(--grad);
      border-radius: 999px; box-shadow: 0 0 12px rgba(46,196,182,0.35);
      transition: width 0.8s cubic-bezier(0.22,1,0.36,1);
    }
    .streak-sub {
      font-size: 12px; color: var(--ink-faint); margin-top: 10px;
      font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em;
    }

    /* Goal chips */
    .goal-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .goal-chip {
      padding: 8px 14px; border-radius: 999px;
      background: rgba(46,196,182,0.07);
      border: 1px solid rgba(46,196,182,0.22);
      font-size: 13px; color: var(--ink); font-weight: 500;
    }
    .goal-chip.primary {
      background: rgba(46,196,182,0.12);
      border-color: rgba(46,196,182,0.4); color: var(--teal);
    }

    /* Tool cards */
    .tool-card {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 20px;
      background: rgba(255,255,255,0.015);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-decoration: none; color: var(--ink);
      transition: all 0.2s ease;
    }
    .tool-card + .tool-card { margin-top: 10px; }
    .tool-card:hover { border-color: var(--line-strong); background: rgba(96,165,250,0.05); transform: translateX(4px); }
    .tool-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(46,196,182,0.08);
      border: 1px solid rgba(46,196,182,0.22);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .tool-info { flex: 1; }
    .tool-name { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
    .tool-why { font-size: 12px; color: var(--ink-faint); }
    .tool-arrow { font-size: 14px; color: var(--ink-faint); transition: all 0.2s ease; }
    .tool-card:hover .tool-arrow { color: var(--teal); transform: translateX(3px); }

    /* Week rows */
    .week-row {
      display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 14px;
      padding: 16px 18px;
      background: rgba(255,255,255,0.015);
      border: 1px solid var(--line); border-radius: 14px;
    }
    .week-row + .week-row { margin-top: 8px; }
    .week-num {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(46,196,182,0.08);
      border: 1px solid rgba(46,196,182,0.22);
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.06em; color: var(--teal);
    }
    .week-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .week-sub { font-size: 11px; color: var(--ink-faint); }
    .week-min { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-faint); letter-spacing: 0.06em; }

    /* Section header */
    .sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sec-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--ink-faint);
    }

    /* Info grid */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .info-cell {
      padding: 14px; background: var(--bg-card);
      border: 1px solid var(--line); border-radius: 14px;
    }
    .info-cell .cell-label {
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.14em; color: var(--ink-faint);
      text-transform: uppercase; margin-bottom: 6px;
    }
    .info-cell .cell-value { font-size: 14px; color: var(--ink); font-weight: 500; line-height: 1.3; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 17px 24px; font-size: 15px; font-weight: 600;
      letter-spacing: -0.005em; border-radius: 14px;
      cursor: pointer; border: none;
      transition: all 0.2s ease; font-family: inherit;
      width: 100%; text-decoration: none;
    }
    .btn-primary {
      background: var(--grad); color: var(--bg);
      box-shadow: 0 12px 36px rgba(46,196,182,0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 44px rgba(46,196,182,0.35); }
    .btn-secondary {
      background: transparent; color: var(--ink-dim);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover { color: var(--ink); border-color: var(--line-strong); }
    .btn-ghost {
      background: none; color: var(--ink-faint);
      padding: 10px; font-size: 12px; letter-spacing: 0.06em;
      cursor: pointer; font-family: inherit; border: none;
    }
    .btn-ghost:hover { color: var(--ink-dim); }
    .cta-row { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }

    /* Empty state */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 40px 24px;
    }
    .glyph {
      width: 56px; height: 56px; border-radius: 16px;
      background: rgba(46,196,182,0.08);
      border: 1px solid rgba(46,196,182,0.25);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px;
    }
    .glyph svg { width: 26px; height: 26px; color: var(--teal); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px;
      background: rgba(46,196,182,0.08);
      border: 1px solid rgba(46,196,182,0.22);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--teal); margin-bottom: 16px;
    }
    .pill-dot { width: 5px; height: 5px; border-radius: 999px; background: var(--teal); }

    .divider { height: 1px; background: var(--line); margin: 20px 0; }

    @media (max-width: 420px) {
      h1.title.big { font-size: 32px; }
      .streak-num { font-size: 58px; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
    const STORAGE_KEY = 'clovelearn_onboarding_v1';

    const GOAL_LABELS = {
      calm:'Calm', focus:'Focus', sleep:'Sleep', resilience:'Resilience',
      compassion:'Self-kindness', confidence:'Confidence', connect:'Connection', purpose:'Meaning',
    };
    const TIME_LABELS = {
      '07:00':'7 AM','09:00':'9 AM','12:30':'12:30 PM','18:00':'6 PM','21:30':'9:30 PM',
      morning:'mornings', midday:'midday', evening:'evenings', flex:'flexible', none:'no reminders',
    };
    const SESSION_LABELS = {
      short:'3–5 min', medium:'8–12 min', long:'15–20 min', mixed:'Mixed lengths',
    };
    const TOOL_LINKS = {
      breath:'meditation-ops.html', journal:'journal-ops.html', focus:'toolshed.html',
      audio:'mindfulness-drill-full.html', scan:'mindfulness-drill-full.html', check:'rosa-checkin.html',
    };
    const ALL_TOOLS = [
      {id:'breath', name:'Breath Room',    icon:'◯', why:'Two-minute paced breathing for any moment.'},
      {id:'journal',name:'Quiet Journal',  icon:'✎', why:'Daily one-question prompts. No streak-shaming.'},
      {id:'focus',  name:'Focus Pulse',    icon:'◐', why:'Three-minute attention drills you can repeat.'},
      {id:'audio',  name:'Voice Practice', icon:'◊', why:'Audio-led sits and body scans.'},
      {id:'scan',   name:'Body Scan',      icon:'☼', why:'A guided sweep — head to feet.'},
      {id:'check',  name:'Mood Check',     icon:'⌁', why:'Sixty-second daily check-in.'},
    ];
    const STYLE_TOOLS = {
      audio:   ['audio','scan','breath'], reading:['journal','check','breath'],
      video:   ['focus','scan','breath'], journal:['journal','check','breath'],
      interact:['focus','breath','check'],quiz:['check','journal','breath'],
    };
    const GOAL_WEEK_MAP = {
      calm:      {title:'Settle the system',    sub:'Breath, body scans, longer exhales.'},
      focus:     {title:'Train attention',      sub:'Single-task drills & open-monitor sits.'},
      sleep:     {title:'Wind-down ritual',     sub:'Evening practices + sleep hygiene cues.'},
      resilience:{title:'Sit with discomfort',  sub:'Short stress inoculation practices.'},
      compassion:{title:'Self-kindness',        sub:'Loving-kindness & inner-critic work.'},
      confidence:{title:'Quiet confidence',     sub:'Body-led grounding, values clarity.'},
      connect:   {title:'Connect deeply',       sub:'Listening prompts & gratitude letters.'},
      purpose:   {title:'Find your throughline',sub:'Journal prompts on what matters most.'},
    };

    function buildTools(a) {
      const styles = a.learningStyle || [];
      const ids = new Set();
      styles.forEach(s => (STYLE_TOOLS[s] || []).forEach(id => ids.add(id)));
      if (ids.size < 3) ['breath','journal','check'].forEach(id => ids.add(id));
      return ALL_TOOLS.filter(t => ids.has(t.id)).slice(0, 3);
    }

    function buildPlan(a) {
      const g = a.goals || []; const min = a.dailyMinutes || 15;
      const picks = g.slice(0, 4); if (!picks.length) picks.push('calm');
      return [
        {...(GOAL_WEEK_MAP[picks[0]] || GOAL_WEEK_MAP.calm), min},
        {...(GOAL_WEEK_MAP[picks[1] || picks[0]] || GOAL_WEEK_MAP.calm), min},
        {...(GOAL_WEEK_MAP[picks[2] || picks[0]] || GOAL_WEEK_MAP.calm), min: min + 2},
        {title:'Integrate', sub:'Mix your favorites · the habit, not the streak.', min},
      ];
    }

    function daysSince(iso) {
      if (!iso) return 1;
      return Math.max(1, Math.floor((Date.now() - new Date(iso)) / 86400000) + 1);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g,
        m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function renderEmpty() {
      document.getElementById('app').innerHTML = `
        <div class="empty-state">
          <div class="glyph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <span class="pill"><span class="pill-dot"></span>CLOVELEARN</span>
          <h1 class="title big" style="margin-bottom:14px;">Your path starts here.</h1>
          <p class="lede" style="max-width:320px;text-align:center;margin-bottom:32px;">Take 12 minutes to build a personal mental growth plan. Free. Private. Yours.</p>
          <a href="onboarding/onboarding.html" class="btn btn-primary" style="max-width:360px;">
            Begin your journey
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </a>
        </div>`;
    }

    function renderPlan(data) {
      const a = data.answers;
      const day    = daysSince(data.completedAt);
      const target = a.streak || 7;
      // Real practice streak — read-only from the operator profile (field-ops
      // owns every write). Only alive if the last practice was today or
      // yesterday; an older last_seen resets on the next session anyway.
      let realStreak = 0;
      try {
        const prof = JSON.parse(localStorage.getItem('od_operator_profile') || 'null');
        if (prof && prof.streak > 0 && prof.last_seen) {
          const gapDays = Math.floor((Date.now() - prof.last_seen) / 86400000);
          if (gapDays <= 1) realStreak = prof.streak;
        }
      } catch (_) {}
      const pct = Math.min(100, Math.round((realStreak / target) * 100));
      const name   = a.firstName ? `, ${esc(a.firstName)}` : '';
      const goals  = (a.goals || ['calm']).slice(0, 4);
      const tools  = buildTools(a);
      const plan   = buildPlan(a);
      const dailyMin  = a.dailyMinutes || 15;
      const bestTime  = TIME_LABELS[a.bestTime] || 'whenever fits';
      const sessionLen = SESSION_LABELS[a.sessionLen] || `${dailyMin} min`;

      document.getElementById('app').innerHTML = `
        <div>
          <div class="eyebrow">Day · ${day}</div>
          <h1 class="title big">Welcome back${name}.</h1>
          <p class="lede">Here's where you are on your 30-day path.</p>
        </div>

        <div class="section streak-card">
          <div class="streak-num">${realStreak}</div>
          <div class="streak-label">${realStreak > 0 ? `day practice streak · goal ${target}` : 'no active streak'}</div>
          <div class="streak-bar-wrap">
            <div class="streak-bar" id="streakBar" style="width:0%"></div>
          </div>
          <div class="streak-sub">${realStreak >= target
            ? 'goal reached — one practice today keeps it alive'
            : realStreak > 0
              ? `${target - realStreak} to your goal · one practice today keeps it alive`
              : 'your streak starts with one practice today — your tools are below'}</div>
        </div>

        <div class="section">
          <div class="sec-header"><div class="sec-label">Your intentions</div></div>
          <div class="goal-chips">
            ${goals.map((g, i) =>
              `<span class="goal-chip${i === 0 ? ' primary' : ''}">${GOAL_LABELS[g] || g}</span>`
            ).join('')}
          </div>
        </div>

        <div class="section">
          <div class="info-grid">
            <div class="info-cell">
              <div class="cell-label">Daily</div>
              <div class="cell-value">${dailyMin} min · ${bestTime}</div>
            </div>
            <div class="info-cell">
              <div class="cell-label">Sessions</div>
              <div class="cell-value">${sessionLen}</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="sec-header"><div class="sec-label">Your tools</div></div>
          ${tools.map(t => `
            <a href="${TOOL_LINKS[t.id] || 'deck.html'}" class="tool-card">
              <div class="tool-icon">${t.icon}</div>
              <div class="tool-info">
                <div class="tool-name">${t.name}</div>
                <div class="tool-why">${t.why}</div>
              </div>
              <div class="tool-arrow">→</div>
            </a>
          `).join('')}
        </div>

        <div class="section">
          <div class="sec-header"><div class="sec-label">Your 4-week path</div></div>
          ${plan.map((w, i) => `
            <div class="week-row">
              <div class="week-num">W${i+1}</div>
              <div>
                <div class="week-title">${w.title}</div>
                <div class="week-sub">${w.sub}</div>
              </div>
              <div class="week-min">${w.min}m</div>
            </div>
          `).join('')}
        </div>

        <div class="cta-row">
          <a href="deck.html" class="btn btn-primary">
            Open the full deck
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
          </a>
          <a href="deck.html" class="btn btn-secondary">← Back to home</a>
        </div>

        <div class="section">
          <div class="sec-header"><div class="sec-label">Take a break</div></div>
          <a href="game/theincrediblemindmachine/index.html" class="tool-card" id="break-card">
            <div class="tool-icon">◐</div>
            <div class="tool-info">
              <div class="tool-name">Mind Machine — a quiet physics puzzle</div>
              <div class="tool-why">Ten minutes off is part of the practice. Your plan will be here when you're back.</div>
            </div>
            <div class="tool-arrow">→</div>
          </a>
        </div>

        <div class="divider"></div>
        <div style="text-align:center;padding-bottom:8px;">
          <button class="btn-ghost" onclick="redoOnboarding()">Start onboarding over</button>
        </div>
      `;

      requestAnimationFrame(() => {
        const bar = document.getElementById('streakBar');
        if (bar) bar.style.width = pct + '%';
      });
    }

    function redoOnboarding() {
      if (confirm('Clear your current plan and restart onboarding?')) {
        try { localStorage.removeItem(STORAGE_KEY); } catch(_) {}
        window.location.href = 'onboarding/onboarding.html';
      }
    }

    function boot() {
      let data = null;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) data = JSON.parse(raw);
      } catch(_) {}

      if (!data || !data.answers || !data.completedAt) {
        renderEmpty();
      } else {
        renderPlan(data);
      }
    }

    boot();
  </script>
  <script src="/clove-signals.js" defer></script>
</body>
</html>
