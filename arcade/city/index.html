<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Circuit — City Block</title>
<meta name="description" content="Neon Circuit City Block — a top-down, server-authoritative city prototype. Walk the block and step into the arcade.">
<meta name="theme-color" content="#060410">
<!--
  Worker endpoint config (optional). The city client connects to same-origin
  /arcade/city/ws by default. To point at a different origin at deploy time:
  <script>window.__NEON_ARCADE_CONFIG__ = { cityWsUrl: "wss://neon-arcade-mesh.YOUR-SUBDOMAIN.workers.dev/arcade/city/ws" };</script>
  Public transport config only — never put a secret/admin token here.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./city.css">
</head>
<body>
<canvas id="cityCanvas" aria-label="Neon Circuit city block (top-down)"></canvas>

<div class="hud">
  <div class="topbar">
    <div class="brand">NEON CIRCUIT <span class="slash">//</span> CITY OS
      <span class="sub">downtown block · prototype</span>
    </div>
    <div class="spacer"></div>
    <div class="pill chip" title="Your city identity">avatar <b id="playerName">connecting…</b></div>
    <div class="pill" role="status" aria-live="polite" title="City authority connection">
      <span class="dot wait" id="statusDot"></span>
      <span id="statusTxt">connecting</span>
    </div>
  </div>

  <div class="ctrlhint">
    <span class="kbhint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows to move · <kbd>E</kbd> to enter</span>
    <span class="renderer-tag">renderer: <span id="rendererTag">—</span></span>
  </div>

  <div class="portal-prompt" id="portalPrompt" role="status" aria-live="polite" hidden>
    <kbd>E</kbd> enter <span class="pp-name">ARCADE</span>
  </div>
  <button class="portal-btn" id="portalBtn" type="button" hidden>Enter Arcade</button>

  <div class="touchpad" id="touchPad" aria-hidden="true"><div class="nub" id="touchNub"></div></div>
</div>

<!-- Vendored Three.js (global, no bundler). If it 404s/fails, the scene falls back to 2D canvas. -->
<script src="/scripts/three.min.js"></script>
<script type="module" src="./city-scene.js"></script>
</body>
</html>
