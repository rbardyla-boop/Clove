<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- LOCAL-ONLY tool. Host may read same-origin package files (connect-src 'self'). The SANDBOX iframe
     is sandbox="allow-scripts" (NULL origin: no storage/same-origin/parent access) with its OWN strict
     CSP (default-src 'none' → no network of any kind, no 'unsafe-eval' → no eval). A srcdoc iframe
     INHERITS + intersects the parent CSP, so 'unsafe-inline' here is what lets the child's inlined module
     run AT ALL; the host page itself has no inline scripts, and the child's null origin + default-src
     'none' remain the real isolation. (connect-src is NOT inherited as a loosening: child default-src
     'none' ∩ parent 'self' = no network in the child.) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Creator Foundation — CF-4 Local Arcade Sandbox</title>
<!--
  LOCAL, OFFLINE arcade package importer + sandbox runner. Imports a data+module package, vets it
  (import-arcade-package.mjs), and runs it ONLY in a hardened, isolated iframe (null origin, no network,
  no eval, no storage) behind a narrow postMessage frame contract. Any result is an UNTRUSTED LOCAL
  PROPOSAL — never a server ticket/prize/score. NO live-world load, NO public upload, NO production.
  Serve from the repo root over a local static server (ES modules need http://):
      python3 -m http.server 8099   →   /arcade/creator/arcade-sandbox/
-->
<style>
  body { margin: 0; background: #07080f; color: #cfe9ff; font: 14px/1.5 ui-monospace, monospace; }
  header { padding: 12px 16px; border-bottom: 1px solid #1b2740; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .04em; }
  h1 span { color: #22e0ff; }
  main { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
  .col { min-width: 280px; }
  button { background: #112; color: #cfe9ff; border: 1px solid #2a3a5a; padding: 8px 12px; border-radius: 6px; cursor: pointer; min-height: 40px; }
  button:hover { border-color: #22e0ff; }
  #sandboxMount { width: 360px; height: 640px; max-width: 100%; background: #05060c; border: 1px solid #1b2740; border-radius: 8px; overflow: hidden; }
  .sb-status { padding: 6px 8px; border-radius: 6px; background: #0d1424; }
  .sb-run { color: #7CFFB0; } .sb-bad { color: #ff6b6b; }
  pre { white-space: pre-wrap; background: #0a1120; border: 1px solid #1b2740; border-radius: 6px; padding: 8px; max-width: 520px; }
  .note { color: #8aa0c0; font-size: 12px; }
</style>
</head>
<body>
<header><h1>CREATOR FOUNDATION <span>//</span> CF-4 LOCAL ARCADE SANDBOX</h1></header>
<main>
  <div class="col">
    <p class="sb-status" id="sandboxStatus">idle</p>
    <p>
      <button id="runSampleBtn" type="button">Load + run sample (sandboxed)</button>
      <button id="tapBtn" type="button">Send tap</button>
      <button id="resultBtn" type="button">Request result</button>
    </p>
    <div id="sandboxMount" aria-label="Local arcade sandbox frame"></div>
    <p class="note">Frame is a null-origin sandboxed iframe: no network, no eval, no storage. Results are
      untrusted local proposals — never a server ticket/prize/score.</p>
  </div>
  <div class="col">
    <p>Import report</p>
    <pre id="sandboxReport">(none)</pre>
    <p>Result proposal</p>
    <pre id="sandboxResult">(none)</pre>
  </div>
</main>
<script type="module" src="./sandbox-runner.mjs"></script>
</body>
</html>
