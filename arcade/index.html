<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Circuit Arcade</title>
<meta name="description" content="Neon Circuit Arcade — Level 1 Main Floor. Walk up to cabinets and play. Pulse Tap is live, with real shared occupancy.">
<meta name="theme-color" content="#080411">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./neon-circuit.css">
<link rel="stylesheet" href="./cabinet-frame.css">
<link rel="stylesheet" href="./cabinet-adapter.css">
<link rel="stylesheet" href="./pulse-tap-game.css">
<link rel="stylesheet" href="./signal-sprint-game.css">
<link rel="stylesheet" href="./prize-counter.css">
<link rel="stylesheet" href="./challenge-board.css">
<link rel="stylesheet" href="./arcade-lobby.css">
</head>
<body>
<div id="app">

  <!-- ===================== ARCADE FLOOR SCENE ===================== -->
  <main class="scene" aria-label="Neon Circuit Arcade — Level 1 Main Floor">
    <div class="ceiling" aria-hidden="true"></div>
    <h1 class="wall-sign">NEON <span class="c">CIRCUIT</span></h1>
    <p class="wall-tag">— level 1 · main floor —</p>
    <div class="floor" aria-hidden="true"></div>
    <div class="floor-glow" aria-hidden="true"></div>

    <div class="cabinets" id="cabinets"><!-- cabinets injected by neon-circuit-floor.js --></div>

    <div class="interact" id="interactPrompt" role="status" aria-live="polite">
      <button class="key" id="interactKey" type="button">
        <span class="kbd" id="interactKbd">E</span>
        <span id="interactLabel">Tap to Play</span>
      </button>
      <div class="target" id="interactTarget">PULSE TAP</div>
    </div>
  </main>

  <!-- ===================== HUD TOP ===================== -->
  <header class="hud-top">
    <button class="player-chip" id="playerChip" type="button" title="Your arcade identity">
      <span class="chip-av" id="chipAv"></span>
      <span class="chip-meta">
        <span class="nm" id="chipName">connecting…</span>
        <span class="st" id="chipSub">instant join · no login</span>
      </span>
    </button>

    <div class="brand" aria-hidden="true">
      <div class="logo">NEON <span class="c">CIRCUIT</span></div>
      <div class="sub">virtual arcade</div>
    </div>

    <div class="status-pill" id="statusPill" role="status" aria-live="polite" title="Room authority connection">
      <span class="dot off" id="statusDot"></span>
      <span class="txt" id="statusTxt">connecting</span>
    </div>

    <button class="room-chip" id="roomBtn" type="button" title="Choose a room">
      <span class="rc-dot" aria-hidden="true"></span>
      <span data-f="roomName">main-floor</span>
      <span aria-hidden="true">▾</span>
    </button>

    <div class="ticket-hud" id="ticketHud" role="status" aria-live="polite" title="Your arcade tickets — server-authoritative"
         style="display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(255,210,63,.5);border-radius:999px;background:rgba(255,210,63,.08);color:#ffd23f;font-weight:700;letter-spacing:.5px">
      <span aria-hidden="true">🎟</span><span id="ticketCount">0</span>
    </div>
    <button class="prize-btn" id="prizeBtn" type="button" title="Open the Prize Counter"
         style="cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid rgba(255,45,149,.55);border-radius:999px;background:rgba(255,45,149,.10);color:#ff2d95;font-weight:700;letter-spacing:.5px;font-family:inherit">
      <span aria-hidden="true">🎁</span><span>Prize Counter</span>
    </button>
    <button class="challenge-btn" id="challengeBtn" type="button" title="Open the Challenge Board"
         style="cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid rgba(177,74,255,.55);border-radius:999px;background:rgba(177,74,255,.10);color:#b14aff;font-weight:700;letter-spacing:.5px;font-family:inherit">
      <span aria-hidden="true">🏆</span><span>Challenges</span>
    </button>
  </header>

  <!-- ===================== INTERACT ACTION ===================== -->
  <div class="action-cluster">
    <button class="act-btn" id="interactBtn" type="button" title="Interact (E)">
      <span class="ic" id="actIco">⚡</span>
      <span class="kbd-mini">E</span>
    </button>
  </div>

  <div class="hint-toast" id="hint" role="status" aria-live="polite"></div>
</div>

<script type="module" src="./neon-circuit-floor.js"></script>
</body>
</html>
